services:
  postgres:
    image: postgres:17-alpine
    container_name: intelibill_postgres
    environment:
      POSTGRES_DB: intelibill_dev
      POSTGRES_USER: intelibill
      POSTGRES_PASSWORD: intelibill_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelibill -d intelibill_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The restricted identity the API connects as, created before the API starts.
  #
  # `intelibill` above is the superuser that owns the schema; it holds BYPASSRLS,
  # so an API connecting as that role ignores every tenant policy with nothing in
  # the log to say so. RuntimeRoleGuard refuses to start on such an identity, so
  # this one-shot is what the backend waits for. It is idempotent and re-runs on
  # every `up`, which is also how a table added by a later migration picks up its
  # grant.
  db-runtime-role:
    profiles: [full]
    image: postgres:17-alpine
    container_name: intelibill_db_runtime_role
    environment:
      PGPASSWORD: intelibill_dev_password
    entrypoint:
      - psql
      - --host=postgres
      - --username=intelibill
      - --dbname=intelibill_dev
      - --file=/scripts/local-runtime-role.sql
    volumes:
      - ./scripts/db:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Local email capture. Registration, password reset and every other identity
  # message goes here instead of to a real inbox, and nothing leaves the machine:
  # the SMTP and web ports are bound to 127.0.0.1 only, because this accepts mail
  # from anyone with no authentication. Read the messages at http://localhost:8025.
  mailpit:
    profiles: [full]
    image: axllent/mailpit:v1.33
    container_name: intelibill_mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      # Keep the capture bounded; this is a scratch inbox, not a record.
      MP_MAX_MESSAGES: "500"

  backend:
    profiles: [full]
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: intelibill_backend
    # The container listens on 8080, the same port it uses when deployed. The
    # host mapping stays 5277 so local tooling and the Angular development
    # environment file keep working unchanged.
    #
    # Schema is not created here: startup no longer migrates. Run
    #   dotnet ef database update --project src/backend/Intelibill.Infrastructure \
    #     --startup-project src/backend/Intelibill.Api
    # against this database first.
    ports:
      - "5277:8080"
    environment:
      # Development, because local mail capture is only permitted there and in
      # Testing — Email:LocalCapture is refused outright in any other
      # environment, and relaying through Mailpit is the documented local setup
      # (docs/auth-email-setup.md). No Development settings file reaches the
      # image; .dockerignore keeps appsettings.Development.json out of the build
      # context, so everything below is the whole configuration.
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - Database__Host=postgres
      - Database__Port=5432
      - Database__Database=intelibill_dev
      # The restricted role, not the schema owner. Connecting as the owner would
      # bypass every tenant policy, and the API refuses to start that way.
      - Database__Username=intelibill_app
      - Database__Password=intelibill_app_password
      # Stated rather than inherited: the guard is off by default in Development,
      # and a local stack that quietly stopped checking its own runtime identity
      # would be the one place a missing shop scope goes unnoticed.
      - Database__RequireRestrictedRuntimeRole=true
      - Jwt__Secret=YourSuperSecretKeyHereChangeInProduction
      - Jwt__Issuer=Intelibill
      - Jwt__Audience=Intelibill
      - App__BaseUrl=http://localhost:4000
      # Sign-up is limited to 5 requests per 15 minutes with a 15-minute backoff,
      # and the bucket is keyed on the caller's address, not the address being
      # enrolled — so behind this stack's web proxy every browser shares one
      # allowance and testing the flow twice exhausts it. Relaxed here to the
      # global default (100 per minute), which still catches a runaway loop. The
      # API refuses to start with this set in any environment but Development or
      # Testing.
      - RateLimiting__RelaxEndpointPolicies=true
      # Rate-limit buckets are HMACs under this key, so the store never holds an
      # address, account or destination. Local placeholder, base64 of 32 ASCII
      # bytes; deployed environments take it from a secret store and every
      # replica must share it.
      - RateLimiting__BucketKey=bG9jYWwtcmF0ZS1saW1pdC1idWNrZXQta2V5LTMyYnk=
      # Identity mail. Without these the enrolment endpoint answers 503
      # Auth.EmailUnavailable: the outbox reports itself unavailable unless
      # delivery is enabled AND it holds a 32-byte key to encrypt stored bodies
      # with. `mailpit` is the one container hostname LocalCapture accepts.
      - Email__Enabled=true
      - Email__LocalCapture=true
      - Email__Host=mailpit
      - Email__Port=1025
      - Email__FromEmail=no-reply@intelibill.local
      - Email__FromName=Intelibill (local)
      # Local placeholder, base64 of 32 ASCII bytes. Deployed environments take
      # this from a secret store; it is no more secret than Jwt__Secret above.
      - Identity__OutboxKey=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    depends_on:
      postgres:
        condition: service_healthy
      db-runtime-role:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      # The API's own liveness endpoint: -f turns a non-2xx answer into a failure,
      # so a process that is listening but broken is reported as unhealthy rather
      # than healthy.
      test: ["CMD", "curl", "-f", "--max-time", "25", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  frontend:
    profiles: [full]
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: intelibill_frontend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      # Where the web server forwards /api and /hubs. Nothing read API_URL.
      - API_ORIGIN=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:

