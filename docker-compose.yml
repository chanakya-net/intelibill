services:
  postgres:
    image: postgres:17-alpine
    container_name: intelibill_postgres
    environment:
      POSTGRES_DB: intelibill_dev
      POSTGRES_USER: intelibill
      POSTGRES_PASSWORD: intelibill_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelibill -d intelibill_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The restricted identity the API connects as, created before the API starts.
  #
  # `intelibill` above is the superuser that owns the schema; it holds BYPASSRLS,
  # so an API connecting as that role ignores every tenant policy with nothing in
  # the log to say so. RuntimeRoleGuard refuses to start on such an identity, so
  # this one-shot is what the backend waits for. It is idempotent and re-runs on
  # every `up`, which is also how a table added by a later migration picks up its
  # grant.
  db-runtime-role:
    profiles: [full]
    image: postgres:17-alpine
    container_name: intelibill_db_runtime_role
    environment:
      PGPASSWORD: intelibill_dev_password
    entrypoint:
      - psql
      - --host=postgres
      - --username=intelibill
      - --dbname=intelibill_dev
      - --file=/scripts/local-runtime-role.sql
    volumes:
      - ./scripts/db:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    profiles: [full]
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: intelibill_backend
    # The container listens on 8080, the same port it uses when deployed. The
    # host mapping stays 5277 so local tooling and the Angular development
    # environment file keep working unchanged.
    #
    # Schema is not created here: startup no longer migrates. Run
    #   dotnet ef database update --project src/backend/Intelibill.Infrastructure \
    #     --startup-project src/backend/Intelibill.Api
    # against this database first.
    ports:
      - "5277:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - Database__Host=postgres
      - Database__Port=5432
      - Database__Database=intelibill_dev
      # The restricted role, not the schema owner. Connecting as the owner would
      # bypass every tenant policy, and the API refuses to start that way.
      - Database__Username=intelibill_app
      - Database__Password=intelibill_app_password
      - Jwt__Secret=YourSuperSecretKeyHereChangeInProduction
      - Jwt__Issuer=Intelibill
      - Jwt__Audience=Intelibill
      - App__BaseUrl=http://localhost:4000
    depends_on:
      postgres:
        condition: service_healthy
      db-runtime-role:
        condition: service_completed_successfully
    healthcheck:
      # The API's own liveness endpoint: -f turns a non-2xx answer into a failure,
      # so a process that is listening but broken is reported as unhealthy rather
      # than healthy.
      test: ["CMD", "curl", "-f", "--max-time", "25", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  frontend:
    profiles: [full]
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: intelibill_frontend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      # Where the web server forwards /api and /hubs. Nothing read API_URL.
      - API_ORIGIN=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:

