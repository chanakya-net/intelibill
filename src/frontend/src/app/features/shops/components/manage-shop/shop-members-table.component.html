<section class="members-card">
  <div class="field-wrap space-y-1.5">
    <h3>Members</h3>
    @if (!members.length) {
      <p class="text-sm text-muted">No members loaded.</p>
    } @else {
      <table class="members-table">
        <thead>
          <tr>
            <th>Member</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (member of members; track member.userId) {
            <tr>
              <td>
                <div class="member-name">{{ displayName(member) }}</div>
                <div class="member-meta">{{ member.email || member.phoneNumber || member.userId }}</div>
              </td>
              <td>
                <select [value]="member.role" [disabled]="disabled || !canManageMembers()" (change)="onRoleChanged(member.userId, $any($event.target).value)">
                  @for (role of availableRoles; track role) {
                    <option [value]="role">{{ role }}</option>
                  }
                </select>
              </td>
              <td>
                <button pButton type="button" severity="danger" [text]="true" [disabled]="disabled || !canManageMembers()" (click)="memberRemoved.emit(member.userId)">Remove</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    }
  </div>
</section>
