<section class="logo-upload-card">
  <div class="field-wrap space-y-1.5">
    <label for="shop-logo">{{ 'shops.logo.label' | transloco }}</label>
    <div class="logo-preview">
      @if (previewUrl()) {
        <img [src]="previewUrl()" [alt]="'shops.logo.previewAlt' | transloco" />
      } @else {
        <div class="logo-placeholder">{{ 'shops.logo.empty' | transloco }}</div>
      }
    </div>
    <input
      #fileInput
      id="shop-logo"
      type="file"
      accept="image/*"
      [disabled]="disabled"
      (change)="onFileSelected($event)"
    />
    @if (selectedFileName()) {
      <p class="logo-file-name">{{ selectedFileName() }}</p>
    }
    <button
      pButton
      type="button"
      severity="secondary"
      [text]="true"
      [disabled]="disabled"
      (click)="onRemoveLogo(fileInput)"
    >
      {{ 'shops.logo.remove' | transloco }}
    </button>
  </div>
</section>
