<form [formGroup]="adjustmentForm" class="adjustment-form" (ngSubmit)="onSave()">
  <div class="field">
    <label>{{ 'inventory.selectBatch' | transloco }}</label>
    <p-autocomplete
      [ngModel]="selectedBatchLabel()"
      [ngModelOptions]="{ standalone: true }"
      [suggestions]="batchSuggestions()"
      (completeMethod)="onBatchSearch($event)"
      (onSelect)="onSelectBatch($event.value)"
      optionLabel="batchNumber"
      [dropdown]="true"
      [forceSelection]="true"
      [placeholder]="'inventory.searchBatchPlaceholder' | transloco"
      [fluid]="true"
    >
      <ng-template let-batch pTemplate="item">
        <div class="batch-option">
          <strong>{{ batch.itemName }}</strong>
          <span>{{ batch.batchNumber }} · {{ batch.barcode }} · {{ 'inventory.quantity' | transloco }}: {{ batch.quantity }}</span>
        </div>
      </ng-template>
    </p-autocomplete>
  </div>

  <div class="form-grid">
    <div class="field">
      <label>{{ 'inventory.adjustmentDirectionLabel' | transloco }}</label>
      <p-select
        formControlName="direction"
        [options]="directionOptions()"
        optionLabel="label"
        optionValue="value"
        [fluid]="true"
      ></p-select>
    </div>
    <div class="field">
      <label>{{ 'inventory.adjustmentReasonLabel' | transloco }}</label>
      <p-select
        formControlName="reason"
        [options]="adjustmentReasonOptions()"
        optionLabel="label"
        optionValue="value"
        [fluid]="true"
      ></p-select>
    </div>
  </div>

  @if (selectedBatchDecreaseBlocked()) {
    <p class="validation-message">{{ 'inventory.decreaseBlockedForEmptyBatch' | transloco }}</p>
  }

  <div class="form-grid">
    <div class="field">
      <label>{{ 'inventory.quantity' | transloco }}</label>
      <p-inputNumber
        formControlName="quantity"
        [min]="0.01"
        mode="decimal"
        [maxFractionDigits]="2"
        [fluid]="true"
      ></p-inputNumber>
    </div>
    <div class="field">
      <label>{{ 'inventory.performedAt' | transloco }}</label>
      <input pInputText type="datetime-local" formControlName="performedAt" />
    </div>
  </div>

  <div class="field">
    <label>{{ 'inventory.notes' | transloco }}</label>
    <textarea
      pTextarea
      formControlName="notes"
      rows="3"
      [placeholder]="'inventory.adjustmentNotesPlaceholder' | transloco"
    ></textarea>
  </div>

  <div class="dialog-actions">
    <button
      pButton
      type="button"
      class="p-button-text"
      [label]="'common.cancel' | transloco"
      [disabled]="saving"
      (click)="onCancel()"
    ></button>
    <button
      pButton
      type="submit"
      [label]="'inventory.submitAdjustment' | transloco"
      [loading]="saving"
      [disabled]="!selectedBatch() || adjustmentForm.invalid || saving"
    ></button>
  </div>
</form>
