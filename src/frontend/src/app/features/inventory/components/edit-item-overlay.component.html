<section
  class="overlay"
  aria-modal="true"
  role="dialog"
  [attr.aria-label]="'inventory.editProduct' | transloco"
>
  <div class="overlay-backdrop" (click)="onClose()"></div>

  <div class="overlay-card">
    <header class="overlay-header">
      <div>
        <p class="eyebrow">{{ 'inventory.title' | transloco }}</p>
        <h2>{{ 'inventory.editProduct' | transloco }}</h2>
        <p class="description">{{ 'inventory.editProductDescription' | transloco }}</p>
      </div>
      <button
        type="button"
        class="close-button"
        [attr.aria-label]="'common.close' | transloco"
        (click)="onClose()"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </header>

    <form class="overlay-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>
        <span>{{ 'inventory.name' | transloco }}</span>
        <input pInputText type="text" formControlName="name" />
      </label>

      <label>
        <span>{{ 'inventory.barcode' | transloco }}</span>
        <div class="barcode-field-row">
          <input pInputText type="text" formControlName="barcode" />
          <button
            pButton
            type="button"
            [label]="'inventory.generateBarcode' | transloco"
            severity="secondary"
            [loading]="barcodeGenerating()"
            (click)="onGenerateBarcode()"
            class="generate-barcode-btn"
          ></button>
        </div>
        @if (barcodeGenerateError()) {
          <p class="error-message">{{ barcodeGenerateError() | transloco }}</p>
        }
        @if (barcodeReplaceConfirmVisible()) {
          <div class="barcode-replace-confirm">
            <span>{{ 'inventory.generateBarcodeReplaceConfirmEdit' | transloco }}</span>
            <button pButton type="button" [label]="'inventory.confirmReplace' | transloco" severity="warn" (click)="confirmBarcodeReplace()"></button>
            <button pButton type="button" [label]="'inventory.keepCurrentBarcode' | transloco" severity="secondary" (click)="cancelBarcodeReplace()"></button>
          </div>
        }
      </label>

      <label>
        <span>{{ 'inventory.description' | transloco }}</span>
        <textarea pInputTextarea formControlName="description" rows="3"></textarea>
      </label>

      <label>
        <span>{{ 'inventory.uom' | transloco }}</span>
        <input pInputText type="text" formControlName="uom" />
      </label>

      <label>
        <span>{{ 'hsn.hsnCode' | transloco }}</span>
        <input pInputText type="text" formControlName="hsnCode" />
      </label>

      <label>
        <span>{{ 'inventory.taxRatePercent' | transloco }}</span>
        <input pInputText type="number" min="0" max="100" step="0.01" formControlName="defaultTaxRatePercent" />
      </label>

      <div class="stock-display">
        <span class="label">{{ 'inventory.currentStock' | transloco }}</span>
        <p-badge
          [value]="item.currentStock | number"
          [severity]="getStockSeverity()"
          class="stock-badge"
        ></p-badge>
      </div>

      @if (serverError()) {
        <p class="error-message">{{ serverError() | transloco }}</p>
      }

      <div class="actions">
        <button
          pButton
          type="button"
          [label]="'common.cancel' | transloco"
          severity="secondary"
          [disabled]="isSubmitting()"
          (click)="onClose()"
        ></button>
        <button
          pButton
          type="submit"
          [label]="'common.save' | transloco"
          [disabled]="isSubmitting()"
        ></button>
      </div>
    </form>

    @if (isSubmitting()) {
      <div class="submit-overlay">
        <p-progressSpinner styleClass="h-8 w-8" strokeWidth="6"></p-progressSpinner>
      </div>
    }
  </div>
</section>
