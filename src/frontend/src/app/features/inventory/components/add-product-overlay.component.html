<section class="overlay" aria-modal="true" role="dialog" [attr.aria-label]="'inventory.productForm' | transloco">
  <div class="overlay-backdrop" (click)="onClose()"></div>

  <div class="overlay-card">
    <header class="overlay-header">
      <div>
        <p class="eyebrow">{{ 'inventory.title' | transloco }}</p>
        <h2>{{ 'inventory.addNewProduct' | transloco }}</h2>
        <p class="description">{{ 'inventory.addNewProductDescription' | transloco }}</p>
      </div>
      <button type="button" class="close-button" [attr.aria-label]="'common.close' | transloco" (click)="onClose()">
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </header>

    <form class="overlay-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>
        <span>{{ 'inventory.name' | transloco }}</span>
        <p-autocomplete
          formControlName="name"
          [suggestions]="nameSuggestions()"
          (completeMethod)="onFilterName($event)"
          (onSelect)="onNameSelected($event.value)"
          appendTo="body"
          styleClass="w-full"
        ></p-autocomplete>
      </label>

      <label>
        <span>{{ 'inventory.barcode' | transloco }}</span>
        <p-autocomplete
          formControlName="barcode"
          [suggestions]="barcodeSuggestions()"
          (completeMethod)="onFilterBarcode($event)"
          (onSelect)="onBarcodeSelected($event.value)"
          appendTo="body"
          styleClass="w-full"
        ></p-autocomplete>
      </label>

      <label>
        <span>{{ 'inventory.description' | transloco }}</span>
        <input pInputText type="text" formControlName="description" />
      </label>

      <label>
        <span>{{ 'inventory.uom' | transloco }}</span>
        <input pInputText type="text" formControlName="uom" />
      </label>

      <label>
        <span>{{ 'inventory.preferredSupplierIdOptional' | transloco }}</span>
        <input pInputText type="text" formControlName="preferredSupplierId" />
      </label>

      <label class="toggle-row" for="isActive">
        <p-checkbox inputId="isActive" formControlName="isActive" [binary]="true"></p-checkbox>
        <span>{{ 'inventory.isActive' | transloco }}</span>
      </label>

      <p class="error-message" *ngIf="serverError()">{{ serverError() | transloco }}</p>

      <div class="actions">
        <button pButton type="button" [label]="'common.cancel' | transloco" severity="secondary" [disabled]="isSubmitting()" (click)="onClose()"></button>
        <button pButton type="submit" [label]="'inventory.addNewProduct' | transloco" [disabled]="isSubmitting()"></button>
      </div>
    </form>

    <div class="submit-overlay" *ngIf="isSubmitting()">
      <p-progressSpinner styleClass="h-8 w-8" strokeWidth="6"></p-progressSpinner>
    </div>
  </div>
</section>
