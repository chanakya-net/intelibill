<section
  class="ib-overlay"
  aria-modal="true"
  role="dialog"
  [attr.aria-label]="'suppliers.supplierForm' | transloco"
>
  <div class="ib-overlay__backdrop" (click)="onClose()"></div>

  <div class="ib-overlay__card">
    <header class="ib-overlay__header">
      <div>
        <p class="ib-overlay__eyebrow">{{ 'suppliers.title' | transloco }}</p>
        <h2 class="ib-overlay__title">{{ 'suppliers.editSupplier' | transloco }}</h2>
        <p class="ib-overlay__description">{{ 'suppliers.editSupplierDescription' | transloco }}</p>
      </div>
      <button
        type="button"
        class="ib-overlay__close"
        [attr.aria-label]="'common.close' | transloco"
        (click)="onClose()"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </header>

    <form class="ib-overlay__form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>
        <span>{{ 'suppliers.name' | transloco }}</span>
        <input pInputText type="text" formControlName="name" />
      </label>

      <label>
        <span>{{ 'suppliers.contactPerson' | transloco }}</span>
        <input pInputText type="text" formControlName="contactPersonName" />
      </label>

      <label>
        <span>{{ 'suppliers.contactPhone' | transloco }}</span>
        <input pInputText type="text" formControlName="contactPersonPhone" />
      </label>

      <label>
        <span>{{ 'suppliers.address' | transloco }}</span>
        <input pInputText type="text" formControlName="address" />
      </label>

      <label>
        <span>{{ 'suppliers.city' | transloco }}</span>
        <input pInputText type="text" formControlName="city" />
      </label>

      <label>
        <span>{{ 'suppliers.state' | transloco }}</span>
        <input pInputText type="text" formControlName="state" />
      </label>

      <label>
        <span>{{ 'suppliers.pin' | transloco }}</span>
        <input pInputText type="text" formControlName="pin" />
      </label>

      <label class="toggle-row" for="isActiveEdit">
        <p-checkbox inputId="isActiveEdit" formControlName="isActive" [binary]="true"></p-checkbox>
        <span>{{ 'suppliers.isActive' | transloco }}</span>
      </label>

      <label class="toggle-row" for="isPreferredEdit">
        <p-checkbox
          inputId="isPreferredEdit"
          formControlName="isPreferred"
          [binary]="true"
        ></p-checkbox>
        <span>{{ 'suppliers.isPreferred' | transloco }}</span>
      </label>

      @if (serverError()) {
        <p class="ib-overlay__error">{{ serverError() | transloco }}</p>
      }

      <div class="ib-overlay__actions">
        <button
          pButton
          type="button"
          [label]="'common.cancel' | transloco"
          severity="secondary"
          [disabled]="isSubmitting()"
          (click)="onClose()"
        ></button>
        <button
          pButton
          type="submit"
          [label]="'suppliers.editSupplier' | transloco"
          [disabled]="isSubmitting()"
        ></button>
      </div>
    </form>

    @if (isSubmitting()) {
      <div class="ib-overlay__busy">
        <p-progressSpinner styleClass="h-8 w-8" strokeWidth="6"></p-progressSpinner>
      </div>
    }
  </div>
</section>
