<div class="suppliers-filter-bar">
  <div class="search-shell">
    <p-iconfield iconPosition="left" class="mobile-search-field">
      <p-inputicon>
        <i class="pi pi-search"></i>
      </p-inputicon>
      <input
        pInputText
        type="text"
        [value]="searchValue"
        (input)="onSearchChange($any($event.target).value)"
        [placeholder]="'suppliers.searchPlaceholder' | transloco"
        class="w-full pr-10"
      />
      @if (searchValue) {
        <p-inputicon iconPosition="right" class="cursor-pointer" (click)="clearSearch()">
          <i class="pi pi-times text-slate-400 hover:text-slate-600"></i>
        </p-inputicon>
      }
    </p-iconfield>
  </div>

  <label for="suppliers-status-filter" class="sr-only">{{ 'common.status' | transloco }}</label>
  <span class="sr-only" data-status-filter-value>{{ statusFilter }}</span>
  <p-select
    inputId="suppliers-status-filter"
    [options]="statusOptions"
    optionLabel="label"
    optionValue="value"
    [(ngModel)]="statusFilter"
    (ngModelChange)="onStatusChange($event)"
    [ngModelOptions]="{ standalone: true }"
    class="w-full"
    appendTo="body"
  >
    <ng-template #selectedItem let-option>
      @if (option) {
        {{ option.label | transloco }}
      }
    </ng-template>
    <ng-template #item let-option>
      {{ option.label | transloco }}
    </ng-template>
  </p-select>
</div>
