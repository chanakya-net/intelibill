<section class="overlay" aria-modal="true" role="dialog" [attr.aria-label]="'suppliers.paymentForm' | transloco">
  <div class="overlay-backdrop" (click)="onClose()"></div>

  <div class="overlay-card">
    <header class="overlay-header">
      <div>
        <p class="eyebrow">{{ 'suppliers.title' | transloco }}</p>
        <h2>{{ 'suppliers.makePayment' | transloco }}</h2>
        <p class="description">{{ 'suppliers.makePaymentDescription' | transloco: { name: supplier.name } }}</p>
      </div>
      <button type="button" class="close-button" [attr.aria-label]="'common.close' | transloco" (click)="onClose()">
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </header>

    <form class="overlay-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>
        <span>{{ 'suppliers.paymentAmount' | transloco }}</span>
        <p-inputnumber
          formControlName="amount"
          mode="currency"
          currency="INR"
          locale="en-IN"
          [min]="0.01"
          [minFractionDigits]="0"
          [maxFractionDigits]="2"
        ></p-inputnumber>
      </label>

      <label>
        <span>{{ 'suppliers.paymentDate' | transloco }}</span>
        <p-datepicker
          formControlName="paymentDate"
          dateFormat="dd/mm/yy"
          [maxDate]="today"
          appendTo="body"
        ></p-datepicker>
      </label>

      <label>
        <span>{{ 'suppliers.paymentNotes' | transloco }}</span>
        <input pInputText type="text" formControlName="notes" />
      </label>

      <p class="error-message" *ngIf="serverError()">{{ serverError() | transloco }}</p>

      <div class="actions">
        <button pButton type="button" [label]="'common.cancel' | transloco" severity="secondary" [disabled]="isSubmitting()" (click)="onClose()"></button>
        <button pButton type="submit" [label]="'suppliers.recordPayment' | transloco" [disabled]="isSubmitting()"></button>
      </div>
    </form>

    <div class="submit-overlay" *ngIf="isSubmitting()">
      <p-progressSpinner styleClass="h-8 w-8" strokeWidth="6"></p-progressSpinner>
    </div>
  </div>
</section>
