<section
  class="ib-overlay"
  aria-modal="true"
  role="dialog"
  [attr.aria-label]="'suppliers.paymentForm' | transloco"
>
  <div class="ib-overlay__backdrop" (click)="onClose()"></div>

  <div class="ib-overlay__card">
    <header class="ib-overlay__header">
      <div>
        <p class="ib-overlay__eyebrow">{{ 'suppliers.title' | transloco }}</p>
        <h2 class="ib-overlay__title">{{ 'suppliers.makePayment' | transloco }}</h2>
        <p class="ib-overlay__description">
          {{ 'suppliers.makePaymentDescription' | transloco: { name: supplier.name } }}
        </p>
      </div>
      <button
        type="button"
        class="ib-overlay__close"
        [attr.aria-label]="'common.close' | transloco"
        (click)="onClose()"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </header>
    @if (pendingPayment(); as pending) {
      <app-pending-financial-operation
        class="ib-overlay__form"
        [intent]="pending"
        [busy]="isSubmitting() || isCheckingPayment()"
        [notice]="pendingNotice() ?? (serverError() || null)"
        (checkStatus)="onCheckPendingPayment()"
        (retry)="onRetryPendingPayment()"
      />
    } @else {
      <app-supplier-payment-form
        [targetId]="supplier.supplierId"
        class="ib-overlay__form"
        [submitting]="isSubmitting()"
        [serverError]="serverError()"
        [maxDate]="today"
        (paymentSubmitted)="onPaymentSubmitted($event)"
        (cancelled)="onClose()"
      />
    }
  </div>
</section>
