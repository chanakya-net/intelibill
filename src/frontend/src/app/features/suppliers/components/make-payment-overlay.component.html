<section
  class="overlay"
  aria-modal="true"
  role="dialog"
  [attr.aria-label]="'suppliers.paymentForm' | transloco"
>
  <div class="overlay-backdrop" (click)="onClose()"></div>

  <div class="overlay-card">
    <header class="overlay-header">
      <div>
        <p class="eyebrow">{{ 'suppliers.title' | transloco }}</p>
        <h2>{{ 'suppliers.makePayment' | transloco }}</h2>
        <p class="description">
          {{ 'suppliers.makePaymentDescription' | transloco: { name: supplier.name } }}
        </p>
      </div>
      <button
        type="button"
        class="close-button"
        [attr.aria-label]="'common.close' | transloco"
        (click)="onClose()"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </header>

    <form class="overlay-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>
        <span>{{ 'suppliers.paymentAmount' | transloco }}</span>
        <p-inputgroup [pt]="currencyGroupPt">
          <p-inputgroup-addon [pt]="currencyAddonPt">{{ 'common.currencySymbol' | transloco }}</p-inputgroup-addon>
          <p-inputNumber
            formControlName="amount"
            mode="decimal"
            [min]="0.01"
            [minFractionDigits]="0"
            [maxFractionDigits]="2"
            [fluid]="true"
            [pt]="currencyInputPt"
          ></p-inputNumber>
        </p-inputgroup>
      </label>

      <label>
        <span>{{ 'suppliers.paymentDate' | transloco }}</span>
        <p-datepicker
          formControlName="paymentDate"
          dateFormat="dd/mm/yy"
          [maxDate]="today"
          appendTo="body"
        ></p-datepicker>
      </label>

      <label>
        <span>{{ 'suppliers.paymentNotes' | transloco }}</span>
        <input pInputText type="text" formControlName="notes" />
      </label>

      @if (serverError()) {
        <p class="error-message">{{ serverError() | transloco }}</p>
      }

      <div class="actions">
        <button
          pButton
          type="button"
          [label]="'common.cancel' | transloco"
          severity="secondary"
          [disabled]="isSubmitting()"
          (click)="onClose()"
        ></button>
        <button
          pButton
          type="submit"
          [label]="'suppliers.recordPayment' | transloco"
          [disabled]="isSubmitting()"
        ></button>
      </div>
    </form>

    @if (isSubmitting()) {
      <div class="submit-overlay">
        <p-progressSpinner styleClass="h-8 w-8" strokeWidth="6"></p-progressSpinner>
      </div>
    }
  </div>
</section>
