<p-dialog
  [visible]="isOpen()"
  (visibleChange)="onVisibilityChange($event)"
  [header]="'suppliers.ledgerEntries' | transloco"
  [modal]="true"
  [style]="{ width: '100%', maxWidth: '1120px' }"
  [draggable]="false"
  class="supplier-detail-dialog"
>
  <div class="ledger-content">
    @if (currentSupplier()) {
      <app-supplier-info-card [supplier]="currentSupplier()!" />
    }

    <div class="supplier-detail">
      <div class="ledger-controls">
        <h3 class="details-heading">{{ 'suppliers.details' | transloco }}</h3>
        <div class="filter-buttons">
          <p-button
            [label]="'suppliers.all' | transloco"
            [outlined]="ledgerFilter() !== 'all'"
            severity="secondary"
            size="small"
            (click)="ledgerFilter.set('all')"
          />
          <p-button
            [label]="'suppliers.goodsReceived' | transloco"
            [outlined]="ledgerFilter() !== 'goods'"
            severity="secondary"
            size="small"
            (click)="ledgerFilter.set('goods')"
          />
          <p-button
            [label]="'suppliers.payments' | transloco"
            [outlined]="ledgerFilter() !== 'payments'"
            severity="secondary"
            size="small"
            (click)="ledgerFilter.set('payments')"
          />
        </div>
      </div>

      <app-supplier-ledger-table [entries]="tableEntries()" [loading]="isLoading()" />

      <h3 class="details-heading" style="margin-top: 2rem;">{{ 'suppliers.makePayment' | transloco }}</h3>
      <app-supplier-payment-form />
    </div>
  </div>
</p-dialog>
