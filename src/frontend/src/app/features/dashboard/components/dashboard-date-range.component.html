<div class="dashboard-range-controls">
  <div class="range-combos">
    <label class="combo-field">
      <span>{{ 'dashboard.rangeSummary' | transloco }}</span>
      <p-select
        [options]="presets"
        optionLabel="label"
        optionValue="value"
        [ngModel]="pendingPreset"
        (ngModelChange)="onSelectPreset($event)"
        appendTo="body"
      >
        <ng-template pTemplate="selectedItem" let-option>
          {{ option.label | transloco }}
        </ng-template>
        <ng-template pTemplate="item" let-option>
          {{ option.label | transloco }}
        </ng-template>
      </p-select>
    </label>
  </div>

  @if (isCustomRange) {
    <div class="range-custom">
      <input
        type="date"
        [ngModel]="pendingStartDate"
        (ngModelChange)="pendingStartDate = $event"
        [max]="pendingEndDate"
        [attr.aria-label]="'dashboard.rangeStart' | transloco"
      />
      <span>–</span>
      <input
        type="date"
        [ngModel]="pendingEndDate"
        (ngModelChange)="onEndDateChange($event)"
        [attr.aria-label]="'dashboard.rangeEnd' | transloco"
      />
    </div>

    @if (futureCorrected) {
      <div class="range-hint range-hint--correction">
        <span class="pi pi-info-circle"></span>
        <span>{{ 'dashboard.futureDateCorrected' | transloco }}</span>
      </div>
    }

    @if (rangeValidationKey) {
      <div class="range-validation-error" role="alert">
        <span class="pi pi-exclamation-circle"></span>
        <span>{{ rangeValidationKey | transloco }}</span>
      </div>
    }
  }

  <div class="range-actions">
    <button
      pButton
      type="button"
      class="range-apply-button"
      [label]="'dashboard.apply' | transloco"
      [disabled]="isApplyDisabled"
      (click)="onApply()"
    ></button>
  </div>
</div>
