<main class="invoice-print-page" [class.invoice-print-page--thermal]="template() === 'thermal'">
  <div class="screen-controls" aria-label="Invoice print controls">
    <button type="button" class="screen-controls__button" (click)="onPrintAgain()">Print again</button>
    <button type="button" class="screen-controls__button screen-controls__button--secondary" (click)="onClose()">
      Close
    </button>
  </div>

  <section *ngIf="isLoading()" class="print-state" aria-live="polite">Loading invoice...</section>

  <section *ngIf="errorMessage()" class="print-state print-state--error" role="alert">
    {{ errorMessage() }}
  </section>

  <ng-container *ngIf="!isLoading() && !errorMessage() && sale() as loadedSale">
    <article *ngIf="shop() as loadedShop" class="invoice" [class.invoice--thermal]="template() === 'thermal'">
      <app-sale-invoice-a4 *ngIf="template() === 'a4'" [sale]="loadedSale" [shop]="loadedShop"></app-sale-invoice-a4>

      <section class="invoice__placeholder invoice__placeholder--thermal" *ngIf="template() === 'thermal'">
        <h2>Thermal receipt preview</h2>
        <p>Printable thermal invoice template placeholder.</p>
      </section>
    </article>
  </ng-container>
</main>
