<main class="invoice-print-page" [class.invoice-print-page--thermal]="template() === 'thermal'">
  <div class="screen-controls" [attr.aria-label]="'sales.invoice.printControls' | transloco">
    <button type="button" class="screen-controls__button" (click)="onPrintAgain()">
      {{ 'sales.invoice.printAgain' | transloco }}
    </button>
    <button
      type="button"
      class="screen-controls__button screen-controls__button--secondary"
      (click)="onClose()"
    >
      {{ 'sales.invoice.close' | transloco }}
    </button>
  </div>

  <section *ngIf="isLoading()" class="print-state" aria-live="polite">
    {{ 'common.loading' | transloco }}
  </section>

  <section *ngIf="errorMessage()" class="print-state print-state--error" role="alert">
    {{ errorMessage().startsWith('sales.') ? (errorMessage() | transloco) : errorMessage() }}
  </section>

  <ng-container *ngIf="!isLoading() && !errorMessage() && sale() as loadedSale">
    <article
      *ngIf="shop() as loadedShop"
      class="invoice-document"
      [class.invoice-document--thermal]="template() === 'thermal'"
    >
      <app-sale-invoice-a4
        *ngIf="template() === 'a4'"
        [sale]="loadedSale"
        [shop]="loadedShop"
        [pendingSync]="pendingSync()"
      ></app-sale-invoice-a4>
      <app-sale-invoice-thermal
        *ngIf="template() === 'thermal'"
        [sale]="loadedSale"
        [shop]="loadedShop"
        [pendingSync]="pendingSync()"
      ></app-sale-invoice-thermal>
    </article>
  </ng-container>
</main>
