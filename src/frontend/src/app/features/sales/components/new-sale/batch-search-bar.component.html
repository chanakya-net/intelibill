<div class="batch-search-bar">
  <div class="batch-search-input">
    <label class="text-xs text-slate-500" [for]="searchInputId">{{ 'inventory.searchPlaceholder' | transloco }}</label>
    <p-autocomplete
      [inputId]="searchInputId"
      [ngModel]="searchTerm"
      (ngModelChange)="onSearchTermChanged($event)"
      [suggestions]="pickerOpen ? [] : searchSuggestions"
      (completeMethod)="onComplete($event)"
      (onSelect)="onSuggestionSelected($event.value, $event.originalEvent)"
      [placeholder]="'inventory.searchPlaceholder' | transloco"
      appendTo="body"
      [fluid]="true"
      (keydown.enter)="onEnterKey($event)"
    ></p-autocomplete>
  </div>

  <div class="batch-search-actions">
    <p-button
      type="button"
      icon="pi pi-camera"
      severity="secondary"
      [text]="true"
      [ariaLabel]="'inventory.openScanner' | transloco"
      (click)="openScanner()"
    />

    <p-button
      [label]="'sales.newSale.search' | transloco"
      icon="pi pi-search"
      (click)="emitSearch()"
      [disabled]="loading"
    />

    <p-button
      type="button"
      [label]="'sales.newSale.openPicker' | transloco"
      icon="pi pi-box"
      (click)="onOpenPicker()"
    />
  </div>
</div>

@if (loading) {
  <div class="flex items-center gap-2 mt-3 text-sm text-slate-500">
    <p-progressSpinner styleClass="h-4 w-4" strokeWidth="6" />
    <span>{{ 'sales.newSale.searching' | transloco }}</span>
  </div>
}
