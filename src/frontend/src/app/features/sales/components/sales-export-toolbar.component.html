<section class="sales-export-toolbar">
  <button
    pButton
    type="button"
    class="export-trigger"
    icon="pi pi-chevron-down"
    iconPos="right"
    data-export-trigger
    [label]="'sales.export.action' | transloco"
    [loading]="isExporting()"
    [disabled]="isExporting()"
    [attr.aria-label]="'sales.export.action' | transloco"
    aria-haspopup="menu"
    (click)="exportMenu.toggle($event)"
  ></button>

  <p-menu
    #exportMenu
    [model]="exportMenuItems()"
    [popup]="true"
    appendTo="body"
    styleClass="sales-export-menu"
  />

  @if (isExporting()) {
    <p class="export-status">{{ 'sales.export.loading' | transloco }}</p>
  }

  @if (exportError()) {
    <p class="error" data-export-error>
      {{ exportError() }}
    </p>
  }
</section>
