<section class="sales-export-toolbar">
  <h2 class="toolbar-heading">{{ 'sales.export.title' | transloco }}</h2>

  <div class="export-controls">
    <div class="date-range-group">
      <label class="label">{{ 'sales.export.dateRange' | transloco }}</label>
      <p-datepicker
        [ngModel]="startDate()"
        (ngModelChange)="startDate.set($event)"
        [showIcon]="true"
        dateFormat="dd/mm/yy"
        [placeholder]="'sales.export.startDate' | transloco"
        [disabled]="isExporting()"
      />
      <span class="text-slate-400">—</span>
      <p-datepicker
        [ngModel]="endDate()"
        (ngModelChange)="endDate.set($event)"
        [showIcon]="true"
        dateFormat="dd/mm/yy"
        [placeholder]="'sales.export.endDate' | transloco"
        [disabled]="isExporting()"
      />
    </div>

    <div class="level-group">
      <label class="label">{{ 'sales.export.level.label' | transloco }}</label>
      <p-select
        [ngModel]="exportLevel()"
        (ngModelChange)="exportLevel.set($event)"
        [options]="exportLevelOptions"
        optionLabel="label"
        optionValue="value"
        styleClass="w-40"
        [disabled]="isExporting()"
      >
        <ng-template pTemplate="selectedItem" let-option>
          {{ option.label | transloco }}
        </ng-template>
        <ng-template pTemplate="item" let-option>
          {{ option.label | transloco }}
        </ng-template>
      </p-select>
    </div>

    <div class="format-buttons">
      <button
        pButton
        type="button"
        icon="pi pi-file-excel"
        data-export-format="xlsx"
        [label]="'sales.export.format.excel' | transloco"
        [loading]="isExporting()"
        [disabled]="isExporting()"
        severity="success"
        outlined="true"
        size="small"
        [attr.aria-label]="'sales.export.format.excel' | transloco"
        (click)="exportToExcel()"
      ></button>
      <button
        pButton
        type="button"
        icon="pi pi-file-pdf"
        data-export-format="pdf"
        [label]="'sales.export.format.pdf' | transloco"
        [loading]="isExporting()"
        [disabled]="isExporting()"
        severity="info"
        outlined="true"
        size="small"
        [attr.aria-label]="'sales.export.format.pdf' | transloco"
        (click)="exportToPdf()"
      ></button>
      <button
        pButton
        type="button"
        icon="pi pi-download"
        data-export-format="tallyXml"
        [label]="'sales.export.format.tally' | transloco"
        [loading]="isExporting()"
        [disabled]="isExporting()"
        severity="secondary"
        outlined="true"
        size="small"
        [attr.aria-label]="'sales.export.format.tally' | transloco"
        (click)="exportToTally()"
      ></button>
    </div>
  </div>

  @if (isExporting()) {
    <p class="export-status">{{ 'sales.export.loading' | transloco }}</p>
  }

  @if (exportError()) {
    <p class="error" data-export-error>
      {{ exportError() }}
    </p>
  }
</section>
