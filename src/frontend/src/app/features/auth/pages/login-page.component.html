<section class="login-shell min-h-screen p-0">
  <!-- Page-level bubble decorations -->
  <div class="pg-bubble pg-b1"></div>
  <div class="pg-bubble pg-b2"></div>
  <div class="pg-bubble pg-ring pg-b3"></div>
  <div class="pg-bubble pg-ring pg-b4"></div>
  <div class="pg-bubble pg-ring pg-b5"></div>
  <div class="pg-bubble pg-b6"></div>

  <div class="auth-stage w-full h-screen">
    <article class="auth-card mx-auto w-full max-w-[26rem] rounded-[1.7rem] shadow-2xl shadow-orange-950/20">
      <header class="auth-header">
        <h2>{{ 'auth.loginNow' | transloco }}</h2>
      </header>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form space-y-4 p-6 pt-6" [class.form-busy]="isHttpLoading()">
        <div class="field-wrap space-y-1.5">
          <label for="email">{{ 'auth.emailAddress' | transloco }}</label>
          <input
            id="email"
            type="email"
            pInputText
            formControlName="email"
            autocomplete="email"
            class="w-full"
            [placeholder]="'auth.emailPlaceholder' | transloco"
            [class.ng-invalid]="form.controls.email.invalid && form.controls.email.touched"
          />
          <p class="field-error" *ngIf="form.controls.email.invalid && form.controls.email.touched">{{ 'auth.validation.emailInvalid' | transloco }}</p>
        </div>

        <div class="field-wrap space-y-1.5">
          <label for="password">{{ 'auth.password' | transloco }}</label>
          <p-password
            inputId="password"
            formControlName="password"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="w-full"
            inputStyleClass="w-full"
            autocomplete="current-password"
            [placeholder]="'auth.password' | transloco"
          ></p-password>
          <p class="field-error" *ngIf="form.controls.password.invalid && form.controls.password.touched">{{ 'auth.validation.passwordRequired' | transloco }}</p>
        </div>

        <p *ngIf="serverError()" class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700">
          {{ getServerErrorMessage() }}
        </p>

        <button
          pButton
          type="submit"
          [label]="isHttpLoading() ? ('auth.signingIn' | transloco) : ('auth.loginCta' | transloco)"
          [disabled]="form.invalid || isHttpLoading()"
          class="auth-submit w-full"
        ></button>

        <p class="social-title">{{ 'auth.orLoginWith' | transloco }}</p>

        <div class="social-actions">
          <button type="button" class="social-button" (click)="onFacebookLogin()" [disabled]="isHttpLoading()">
            <span class="social-icon social-icon-fb">f</span>
            <span>{{ 'auth.facebook' | transloco }}</span>
          </button>
          <button type="button" class="social-button" (click)="onGoogleLogin()" [disabled]="isHttpLoading()">
            <span class="social-icon social-icon-google">G</span>
            <span>{{ 'auth.google' | transloco }}</span>
          </button>
        </div>

        <p class="signup-hint">{{ 'auth.notMember' | transloco }} <a routerLink="/register">{{ 'auth.signupNow' | transloco }}</a></p>

        <div class="lang-pick">
          <i class="pi pi-globe" aria-hidden="true"></i>
          <select
            id="language"
            [attr.aria-label]="'common.language' | transloco"
            (change)="onLanguageChanged($any($event.target).value)"
          >
            <option
              *ngFor="let language of supportedLanguages"
              [value]="language"
              [selected]="language === currentLanguage()"
            >{{ nativeLanguageNames[language] }}</option>
          </select>
        </div>
      </form>

      <div class="form-overlay" *ngIf="isHttpLoading()">
        <p-progressSpinner strokeWidth="4" styleClass="auth-spinner"></p-progressSpinner>
      </div>
    </article>

    <aside class="visual-panel" aria-hidden="true">
      <div class="v-disc v-disc-one"></div>
      <div class="v-disc v-disc-two"></div>
      <div class="v-disc v-disc-three"></div>
    </aside>
  </div>
</section>
