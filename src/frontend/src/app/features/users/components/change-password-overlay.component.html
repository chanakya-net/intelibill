<section class="profile-overlay" aria-modal="true" role="dialog">
  <div class="overlay-backdrop"></div>

  <article class="overlay-card" [class.card-busy]="isSubmitting()">
    <header class="overlay-header">
      <button
        pButton
        type="button"
        icon="pi pi-times"
        severity="secondary"
        [text]="true"
        [rounded]="true"
        class="overlay-close"
        [disabled]="isSubmitting()"
        [attr.aria-label]="'common.close' | transloco"
        (click)="onClose()"
      ></button>

      <p class="overlay-kicker">{{ 'profile.security' | transloco }}</p>
      <h2>{{ 'profile.changePassword' | transloco }}</h2>
      <p>{{ 'profile.changePasswordDescription' | transloco }}</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="overlay-form space-y-4">
      <div class="field-wrap space-y-1.5">
        <label for="current-password">{{ 'profile.currentPassword' | transloco }}</label>
        <p-password
          inputId="current-password"
          formControlName="currentPassword"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
        ></p-password>
      </div>

      <div class="field-wrap space-y-1.5">
        <label for="new-password">{{ 'profile.newPassword' | transloco }}</label>
        <p-password
          inputId="new-password"
          formControlName="newPassword"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
        ></p-password>
      </div>

      <div class="field-wrap space-y-1.5">
        <label for="confirm-new-password">{{ 'profile.retypeNewPassword' | transloco }}</label>
        <p-password
          inputId="confirm-new-password"
          formControlName="confirmNewPassword"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
        ></p-password>
      </div>

      <p
        *ngIf="form.hasError('passwordMismatch') && form.controls.confirmNewPassword.touched"
        class="server-error"
      >
        {{ 'profile.validation.passwordsMustMatch' | transloco }}
      </p>

      <p *ngIf="serverError()" class="server-error">{{ serverError() | transloco }}</p>

      <button
        pButton
        type="submit"
        [label]="isSubmitting() ? ('profile.changing' | transloco) : ('profile.changePassword' | transloco)"
        [loading]="isSubmitting()"
        [disabled]="form.invalid || isSubmitting()"
        class="submit-button w-full"
      ></button>
    </form>

    <div class="submit-overlay" *ngIf="isSubmitting()">
      <p-progressSpinner strokeWidth="4" [pt]="progressSpinnerPt"></p-progressSpinner>
    </div>
  </article>
</section>
