<section
  class="overlay"
  aria-modal="true"
  role="dialog"
  [attr.aria-label]="'users.inviteMember' | transloco"
>
  <div class="overlay-backdrop" (click)="onClose()"></div>

  <div class="overlay-card">
    <header class="overlay-header">
      <div>
        <p class="eyebrow">{{ 'users.shopUsers' | transloco }}</p>
        <h2>{{ 'users.inviteMember' | transloco }}</h2>
        <p class="description">
          {{ 'users.inviteMemberDescription' | transloco: { shop: activeShopName() } }}
        </p>
      </div>
      <button
        type="button"
        class="close-button"
        [attr.aria-label]="'common.close' | transloco"
        (click)="onClose()"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </header>

    <form class="overlay-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>
        <span>{{ 'users.email' | transloco }}</span>
        <input pInputText type="email" formControlName="email" autocomplete="email" />
      </label>

      <label>
        <span>{{ 'users.role' | transloco }}</span>
        <select formControlName="role">
          <option value="Manager">{{ 'users.manager' | transloco }}</option>
          <option value="Staff">{{ 'users.staff' | transloco }}</option>
        </select>
      </label>

      <p class="description">{{ 'users.inviteMemberNoCredentials' | transloco }}</p>

      @if (serverError()) {
        <p class="error-message">{{ serverError() | transloco }}</p>
      }

      <div class="actions">
        <button
          pButton
          type="button"
          [label]="'common.cancel' | transloco"
          severity="secondary"
          [disabled]="isSubmitting()"
          (click)="onClose()"
        ></button>
        <button
          pButton
          type="submit"
          [label]="'users.sendInvitation' | transloco"
          [disabled]="isSubmitting()"
        ></button>
      </div>
    </form>

    @if (isSubmitting()) {
      <div class="submit-overlay">
        <p-progressSpinner styleClass="h-8 w-8" strokeWidth="6"></p-progressSpinner>
      </div>
    }
  </div>
</section>
