<section class="overlay" aria-modal="true" role="dialog" aria-label="Edit shop user">
  <div class="overlay-backdrop" (click)="onClose()"></div>

  <div class="overlay-card">
    <header class="overlay-header">
      <div>
        <p class="eyebrow">Shop Users</p>
        <h2>Edit User</h2>
        <p class="description">Update role and login access for this user.</p>
      </div>
      <button type="button" class="close-button" aria-label="Close" (click)="onClose()">
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </header>

    <form class="overlay-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <fieldset class="shop-selection">
        <legend>Shops</legend>
        <p class="shop-selection-description">Select the shops this user should have access to.</p>

        <div class="shop-options">
          <label class="shop-option" *ngFor="let shop of availableShops()">
            <input
              type="checkbox"
              [checked]="isShopSelected(shop.shopId)"
              (change)="onToggleShop(shop.shopId, $any($event.target).checked)"
            />
            <span>
              {{ shop.shopName }}
              <small *ngIf="shop.isDefault">Default</small>
            </span>
          </label>
        </div>
      </fieldset>

      <label>
        <span>First Name</span>
        <input pInputText type="text" formControlName="firstName" autocomplete="given-name" />
      </label>

      <label>
        <span>Last Name</span>
        <input pInputText type="text" formControlName="lastName" autocomplete="family-name" />
      </label>

      <label>
        <span>Email</span>
        <input pInputText type="email" formControlName="email" autocomplete="email" />
      </label>

      <label>
        <span>Mobile Number</span>
        <input pInputText type="text" formControlName="phoneNumber" autocomplete="tel" />
      </label>

      <label>
        <span>Role</span>
        <select formControlName="role">
          <option value="Manager">Manager</option>
          <option value="SalesPerson">Sales Person</option>
        </select>
      </label>

      <label class="toggle-row" for="isLoginEnabled">
        <p-checkbox inputId="isLoginEnabled" formControlName="isLoginEnabled" [binary]="true"></p-checkbox>
        <span>Allow this user to login</span>
      </label>

      <p class="error-message" *ngIf="serverError()">{{ serverError() }}</p>

      <div class="actions">
        <button pButton type="button" label="Cancel" severity="secondary" [disabled]="isSubmitting()" (click)="onClose()"></button>
        <button pButton type="submit" label="Save Changes" [disabled]="isSubmitting()"></button>
      </div>
    </form>

    <div class="submit-overlay" *ngIf="isSubmitting()">
      <p-progressSpinner styleClass="h-8 w-8" strokeWidth="6"></p-progressSpinner>
    </div>
  </div>
</section>
