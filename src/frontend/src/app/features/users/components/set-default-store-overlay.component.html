<section
  class="profile-overlay"
  aria-modal="true"
  role="dialog"
  [attr.aria-label]="'shops.defaultStore.title' | transloco"
>
  <div class="overlay-backdrop"></div>

  <article class="overlay-card" [class.card-busy]="isSubmitting()">
    <header class="overlay-header">
      <button
        pButton
        type="button"
        icon="pi pi-times"
        severity="secondary"
        [text]="true"
        [rounded]="true"
        class="overlay-close"
        [disabled]="isSubmitting()"
        [attr.aria-label]="'shops.defaultStore.close' | transloco"
        (click)="onClose()"
      ></button>

      <p class="overlay-kicker">{{ 'shops.defaultStore.workspace' | transloco }}</p>
      <h2>{{ 'shops.defaultStore.title' | transloco }}</h2>
      <p>{{ 'shops.defaultStore.description' | transloco }}</p>
    </header>

    <div class="overlay-form space-y-3">
      @for (shop of shops; track shop) {
        <button
          pButton
          type="button"
          severity="secondary"
          [outlined]="shop.shopId !== activeShopId"
          [label]="shop.shopName"
          [disabled]="isSubmitting()"
          class="shop-option w-full"
          (click)="onSetDefault(shop.shopId)"
        ></button>
      }

      @if (serverError()) {
        <p class="server-error">{{ serverError() | transloco }}</p>
      }
    </div>

    @if (isSubmitting()) {
      <div class="submit-overlay">
        <p-progressSpinner strokeWidth="4" styleClass="overlay-spinner"></p-progressSpinner>
      </div>
    }
  </article>
</section>
