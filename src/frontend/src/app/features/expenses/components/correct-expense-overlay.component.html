<section
  class="overlay"
  aria-modal="true"
  role="dialog"
  aria-label="Correct Expense"
>
  <div class="overlay-backdrop" (click)="onClose()"></div>

  <div class="overlay-card">
    <header class="overlay-header">
      <div>
        <p class="eyebrow">Expenses</p>
        <h2>Correct Expense</h2>
        <p class="description">Update the details of the expense below.</p>
      </div>
      <button
        type="button"
        class="close-button"
        aria-label="Close"
        (click)="onClose()"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </header>

    <form class="overlay-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>
        <span>Category</span>
        <input
          pInputText
          type="text"
          formControlName="categoryName"
          list="categoryList"
        />
        <datalist id="categoryList">
          @for (category of categories(); track category.id) {
            <option [value]="category.name"></option>
          }
        </datalist>
      </label>

      <label>
        <span>Amount</span>
        <input pInputText type="number" step="0.01" formControlName="amount" />
      </label>

      <label>
        <span>Paid To</span>
        <input pInputText type="text" formControlName="paidTo" />
      </label>

      <label>
        <span>Description</span>
        <input pInputText type="text" formControlName="description" />
      </label>

      <label>
        <span>Expense Date</span>
        <input pInputText type="date" formControlName="expenseDate" />
      </label>

      @if (serverError()) {
        <p class="error-message">{{ serverError() }}</p>
      }

      <div class="actions">
        <button
          pButton
          type="button"
          label="Cancel"
          severity="secondary"
          [disabled]="isSubmitting()"
          (click)="onClose()"
        ></button>
        <button
          pButton
          type="submit"
          label="Correct Expense"
          [disabled]="form.invalid || isSubmitting()"
        ></button>
      </div>
    </form>

    @if (isSubmitting()) {
      <div class="submit-overlay">
        <p-progressSpinner
          styleClass="h-8 w-8"
          strokeWidth="6"
        ></p-progressSpinner>
      </div>
    }
  </div>
</section>
