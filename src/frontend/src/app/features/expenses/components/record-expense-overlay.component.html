<section
  class="overlay"
  aria-modal="true"
  role="dialog"
  [attr.aria-label]="'expenses.recordExpense' | transloco"
>
  <div class="overlay-backdrop" (click)="onClose()"></div>

  <div class="overlay-card">
    <header class="overlay-header">
      <div>
        <p class="eyebrow">{{ 'expenses.title' | transloco }}</p>
        <h2>{{ 'expenses.recordExpense' | transloco }}</h2>
        <p class="description">{{ 'expenses.recordExpenseDescription' | transloco }}</p>
      </div>
      <button
        type="button"
        class="close-button"
        [attr.aria-label]="'common.close' | transloco"
        (click)="onClose()"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </header>

    <form class="overlay-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label
        [class.field-invalid]="
          form.controls.categoryName.touched && form.controls.categoryName.invalid
        "
      >
        <span>{{ 'expenses.category' | transloco }}</span>
        <p-select
          formControlName="categoryName"
          [options]="selectableCategories()"
          optionLabel="name"
          optionValue="name"
          [placeholder]="'expenses.category' | transloco"
          [editable]="true"
          [fluid]="true"
          [attr.aria-invalid]="
            form.controls.categoryName.touched && form.controls.categoryName.invalid
          "
          aria-describedby="record-category-error"
        ></p-select>
        @if (form.controls.categoryName.touched && form.controls.categoryName.invalid) {
          <p id="record-category-error" class="field-error">{{ 'common.required' | transloco }}</p>
        }
      </label>

      <label [class.field-invalid]="form.controls.amount.touched && form.controls.amount.invalid">
        <span>{{ 'expenses.amount' | transloco }}</span>
        <p-inputgroup [pt]="currencyGroupPt">
          <p-inputgroup-addon [pt]="currencyAddonPt">{{
            'common.currencySymbol' | transloco
          }}</p-inputgroup-addon>
          <p-inputNumber
            formControlName="amount"
            mode="decimal"
            [min]="0"
            [maxFractionDigits]="2"
            [fluid]="true"
            [pt]="currencyInputPt"
            [attr.aria-invalid]="form.controls.amount.touched && form.controls.amount.invalid"
            aria-describedby="record-amount-error"
          ></p-inputNumber>
        </p-inputgroup>
        @if (form.controls.amount.touched && form.controls.amount.invalid) {
          <p id="record-amount-error" class="field-error">{{ 'common.required' | transloco }}</p>
        }
      </label>

      <label [class.field-invalid]="form.controls.paidTo.touched && form.controls.paidTo.invalid">
        <span>{{ 'expenses.paidTo' | transloco }}</span>
        <input
          pInputText
          type="text"
          formControlName="paidTo"
          [attr.aria-invalid]="form.controls.paidTo.touched && form.controls.paidTo.invalid"
          aria-describedby="record-paid-to-error"
        />
        @if (form.controls.paidTo.touched && form.controls.paidTo.invalid) {
          <p id="record-paid-to-error" class="field-error">{{ 'common.required' | transloco }}</p>
        }
      </label>

      <label>
        <span>{{ 'expenses.description' | transloco }}</span>
        <textarea pInputTextarea rows="3" formControlName="description"></textarea>
      </label>

      <label>
        <span>{{ 'expenses.expenseDate' | transloco }}</span>
        <p-datePicker
          formControlName="expenseDate"
          dateFormat="yy-mm-dd"
          [showIcon]="true"
          [showButtonBar]="true"
          [fluid]="true"
        ></p-datePicker>
      </label>

      @if (serverError()) {
        <p class="error-message">{{ serverError() | transloco }}</p>
      }

      <div class="actions">
        <button
          pButton
          type="button"
          [label]="'common.cancel' | transloco"
          severity="secondary"
          [disabled]="isSubmitting()"
          (click)="onClose()"
        ></button>
        <button
          pButton
          type="submit"
          [label]="'expenses.recordExpense' | transloco"
          [disabled]="isSubmitting()"
        ></button>
      </div>
    </form>

    @if (isSubmitting()) {
      <div class="submit-overlay">
        <p-progressSpinner styleClass="h-8 w-8" strokeWidth="6"></p-progressSpinner>
      </div>
    }
  </div>
</section>
