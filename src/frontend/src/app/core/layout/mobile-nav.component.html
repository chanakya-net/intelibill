<button
  type="button"
  class="mobile-menu-trigger"
  [attr.aria-expanded]="isDrawerVisible()"
  [attr.aria-label]="'shell.appName' | transloco"
  (click)="onToggleMobileMenu()"
>
  <i
    class="pi"
    [class.pi-bars]="!isDrawerVisible()"
    [class.pi-times]="isDrawerVisible()"
    aria-hidden="true"
  ></i>
</button>

<p-drawer
  [visible]="isDrawerVisible()"
  (visibleChange)="onDrawerVisibleChange($event)"
  position="left"
  [modal]="true"
  [dismissible]="true"
  [closable]="true"
  [closeOnEscape]="true"
  [blockScroll]="true"
  appendTo="body"
  styleClass="mobile-nav-drawer"
  [header]="'shell.appName' | transloco"
>
  <div class="mobile-drawer-content">
    <nav class="mobile-drawer-navigation" [attr.aria-label]="'shell.mainNavigation' | transloco">
      <p-panelmenu
        [model]="drawerMenuItems"
        [multiple]="true"
        styleClass="shell-panelmenu shell-panelmenu-mobile"
        [pt]="panelMenuPt"
      ></p-panelmenu>
    </nav>

    @if (profileDrawerMenuItems.length > 0) {
      <div
        class="mobile-profile-section"
        [style.--profile-initials]="'&quot;' + profileInitials + '&quot;'"
      >
        <p-panelmenu
          [model]="profileDrawerMenuItems"
          [multiple]="false"
          styleClass="shell-panelmenu shell-panelmenu-profile shell-panelmenu-mobile"
          [pt]="panelMenuPt"
        ></p-panelmenu>
      </div>
    }
  </div>
</p-drawer>
