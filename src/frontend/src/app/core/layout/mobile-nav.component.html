<button
  type="button"
  class="mobile-menu-trigger"
  [attr.aria-expanded]="isDrawerVisible()"
  [attr.aria-label]="'shell.appName' | transloco"
  (click)="onToggleMobileMenu()"
>
  <i
    class="pi"
    [class.pi-bars]="!isDrawerVisible()"
    [class.pi-times]="isDrawerVisible()"
    aria-hidden="true"
  ></i>
</button>

<p-drawer
  [visible]="isDrawerVisible()"
  (visibleChange)="onDrawerVisibleChange($event)"
  position="left"
  [modal]="true"
  [dismissible]="true"
  [closable]="true"
  [closeOnEscape]="true"
  [blockScroll]="true"
  appendTo="body"
  styleClass="mobile-nav-drawer"
  [header]="'shell.appName' | transloco"
>
  <p-panelmenu
    [model]="drawerMenuItems"
    [multiple]="true"
    styleClass="shell-panelmenu shell-panelmenu-mobile"
    [pt]="panelMenuPt"
  ></p-panelmenu>
</p-drawer>
