<div class="app-shell min-h-screen">
  <header class="shell-header">
    <div class="shell-header-inner">
      <div class="shell-brand">
        <div class="shell-logo">
          OZ
        </div>
        <div class="shell-shop" #shopMenuRoot>
          <p class="shell-suite-label">{{ 'shell.enterpriseSuite' | transloco }}</p>
          <h1 class="shell-title">{{ 'shell.appName' | transloco }}</h1>

          <button
            type="button"
            class="active-shop-trigger active-shop-trigger-desktop"
            *ngIf="activeShopLabel() as activeShopCaption"
            [attr.aria-expanded]="isShopMenuOpen()"
            aria-haspopup="menu"
            [attr.aria-label]="'shell.switchActiveShop' | transloco"
            (click)="onToggleShopMenu()"
          >
            <span class="active-shop-caption">{{ activeShopCaption }}</span>
            <i class="pi pi-chevron-down" aria-hidden="true"></i>
          </button>

          <button
            type="button"
            class="active-shop-trigger active-shop-trigger-mobile"
            *ngIf="activeShopLabel() as activeShopCaption"
            [attr.aria-expanded]="isShopMenuOpen()"
            aria-haspopup="menu"
            [attr.aria-label]="'shell.switchActiveShop' | transloco"
            (click)="onToggleShopMenu()"
          >
            <span class="active-shop-caption">{{ activeShopCaption }}</span>
            <i class="pi pi-chevron-down" aria-hidden="true"></i>
          </button>

          <div class="shop-menu" *ngIf="isShopMenuOpen()" role="menu" [attr.aria-label]="'shell.availableShops' | transloco">
            <button
              type="button"
              role="menuitem"
              *ngFor="let shop of shops()"
              class="shop-menu-item"
              [class.is-current]="shop.shopId === activeShopId()"
              (click)="onSelectShop(shop.shopId)"
            >
              {{ getShopDisplayLabel(shop) }}
              <span *ngIf="shop.shopId === activeShopId()">{{ 'shell.active' | transloco }}</span>
            </button>
          </div>
        </div>

        <div class="shell-middle-zone" *ngIf="inventoryMenuItems().length > 0">
          <div class="shell-primary-nav" #inventoryMenuRoot>
            <button
              type="button"
              class="inventory-trigger"
              [attr.aria-label]="'shell.manageInventory' | transloco"
              [attr.aria-expanded]="isInventoryMenuOpen()"
              aria-haspopup="menu"
              (click)="onToggleInventoryMenu($event, inventoryMenu)"
            >
              <i class="pi pi-box" aria-hidden="true"></i>
              <span>{{ 'shell.manageInventory' | transloco }}</span>
              <i class="pi pi-chevron-down" aria-hidden="true"></i>
            </button>

            <p-tieredMenu
              #inventoryMenu
              [model]="inventoryMenuItems()"
              [popup]="true"
              [appendTo]="inventoryMenuRoot"
              styleClass="inventory-prime-menu"
              [attr.aria-label]="'shell.manageInventory' | transloco"
              (onShow)="isInventoryMenuOpen.set(true)"
              (onHide)="isInventoryMenuOpen.set(false)"
            ></p-tieredMenu>
          </div>
        </div>
      </div>

      <div class="shell-actions" #profileMenuRoot>
        <button
          #mobileMenuTrigger
          type="button"
          class="mobile-menu-trigger"
          [attr.aria-expanded]="isMobileMenuOpen()"
          [attr.aria-label]="'shell.appName' | transloco"
          (click)="onToggleMobileMenu()"
        >
          <i class="pi" [class.pi-bars]="!isMobileMenuOpen()" [class.pi-times]="isMobileMenuOpen()" aria-hidden="true"></i>
        </button>

        <button
          type="button"
          class="profile-trigger"
          [attr.aria-label]="'shell.openProfileMenu' | transloco"
          [attr.aria-expanded]="isProfileMenuOpen()"
          aria-haspopup="menu"
          (click)="onToggleProfileMenu($event, profileMenu)"
        >
          <span class="profile-avatar">{{ profileInitials() }}</span>
          <span class="profile-text">
            <span class="profile-name">{{ profileDisplayName() }}</span>
            <span class="profile-label">{{ 'shell.profile' | transloco }}</span>
          </span>
          <i class="pi pi-cog profile-gear" aria-hidden="true"></i>
        </button>

        <p-tieredMenu
          #profileMenu
          [model]="profileMenuItems()"
          [popup]="true"
          styleClass="profile-prime-menu"
          [attr.aria-label]="'shell.profileActions' | transloco"
          (onShow)="isProfileMenuOpen.set(true)"
          (onHide)="isProfileMenuOpen.set(false)"
        ></p-tieredMenu>
      </div>
    </div>

    <nav class="mobile-nav" *ngIf="isMobileMenuOpen()" #mobileNavRef aria-label="Mobile navigation">
      <div class="mobile-nav-section" *ngIf="inventoryMenuItems().length > 0">
        <button type="button" class="mobile-nav-section-toggle" (click)="onToggleMobileSection('inventory')">
          <span class="mobile-nav-section-label">{{ 'shell.manageInventory' | transloco }}</span>
          <i class="pi pi-chevron-down mobile-nav-section-chevron" [class.rotated]="isMobileSectionExpanded('inventory')" aria-hidden="true"></i>
        </button>
        <div *ngIf="isMobileSectionExpanded('inventory')" class="mobile-nav-section-items">
          <button
            *ngFor="let item of inventoryMenuItems()"
            type="button"
            class="mobile-nav-item"
            [disabled]="item.disabled ?? false"
            (click)="onMobileNavItemClick(item)"
          >
            <i [class]="item.icon" aria-hidden="true"></i>
            <span>{{ item.label }}</span>
          </button>
        </div>
      </div>

      <div class="mobile-nav-section">
        <button type="button" class="mobile-nav-section-toggle" (click)="onToggleMobileSection('profile')">
          <span class="mobile-nav-section-label">{{ 'shell.profile' | transloco }}</span>
          <i class="pi pi-chevron-down mobile-nav-section-chevron" [class.rotated]="isMobileSectionExpanded('profile')" aria-hidden="true"></i>
        </button>
        <div *ngIf="isMobileSectionExpanded('profile')" class="mobile-nav-section-items">
        <ng-container *ngFor="let item of profileMenuItems()">
          <button
            type="button"
            class="mobile-nav-item"
            [disabled]="item.disabled ?? false"
            (click)="onMobileNavItemClick(item)"
          >
            <i [class]="item.icon" aria-hidden="true"></i>
            <span>{{ item.label }}</span>
            <i
              *ngIf="item.items?.length"
              class="pi pi-chevron-down mobile-nav-chevron"
              [class.rotated]="expandedMobileSectionLabel() === item.label"
              aria-hidden="true"
            ></i>
          </button>
          <div class="mobile-nav-subitems" *ngIf="item.items?.length && expandedMobileSectionLabel() === item.label">
            <button
              *ngFor="let sub of item.items"
              type="button"
              class="mobile-nav-subitem"
              [disabled]="sub.disabled ?? false"
              (click)="onMobileNavItemClick(sub)"
            >
              <i *ngIf="sub.icon" [class]="sub.icon" aria-hidden="true"></i>
              <span>{{ sub.label }}</span>
            </button>
          </div>
        </ng-container>
        </div>
      </div>
    </nav>
  </header>

  <main class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
    <router-outlet></router-outlet>
  </main>

  <app-create-shop-overlay
    *ngIf="showCreateShopOverlay()"
    (closeRequested)="onCreateShopOverlayClose()"
  ></app-create-shop-overlay>

  <app-manage-shop-overlay
    *ngIf="showManageShopOverlay()"
    [shops]="shops()"
    (closeRequested)="onManageShopOverlayClose()"
  ></app-manage-shop-overlay>

  <app-update-profile-overlay
    *ngIf="showUpdateProfileOverlay() && session()?.user"
    [user]="session()!.user"
    (closeRequested)="onProfileOverlayClose()"
  ></app-update-profile-overlay>

  <app-change-password-overlay
    *ngIf="showChangePasswordOverlay()"
    (closeRequested)="onProfileOverlayClose()"
  ></app-change-password-overlay>

</div>
