name: Infrastructure Plan
run-name: "${{ github.workflow }} · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/infra-plan.yml
      - .tofu/envs/**
      - .tofu/modules/**
      - .tofu/scripts/**

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: infra-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
  TF_VAR_admin_object_id: ${{ vars.TOFU_ADMIN_OBJECT_ID }}
  TF_VAR_admin_principal_name: ${{ vars.TOFU_ADMIN_PRINCIPAL_NAME }}
  TF_VAR_secret_officer_object_ids: ${{ vars.TOFU_SECRET_OFFICER_OBJECT_IDS }}

jobs:
  plan:
    name: Plan ${{ matrix.layer }}
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer:
          - shared
          - dev
          - prod

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Validate required identifiers
        env:
          AZURE_CLIENT_ID_PLAN: ${{ vars.AZURE_CLIENT_ID_PLAN }}
        run: |
          set -euo pipefail
          required_variables=(
            AZURE_CLIENT_ID_PLAN
            TF_VAR_subscription_id
            TF_VAR_tenant_id
            TF_VAR_admin_object_id
            TF_VAR_admin_principal_name
            TF_VAR_secret_officer_object_ids
          )
          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              printf 'Required GitHub variable is empty: %s\n' "${variable_name}" >&2
              exit 1
            fi
          done

      - name: Azure login with read-only plan identity
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize ${{ matrix.layer }}
        run: |
          tofu -chdir=".tofu/envs/${{ matrix.layer }}" init \
            -input=false \
            -lockfile=readonly

      - name: Validate ${{ matrix.layer }}
        run: tofu -chdir=".tofu/envs/${{ matrix.layer }}" validate

      - name: Plan ${{ matrix.layer }}
        id: plan
        env:
          PLAN_FILE: ${{ runner.temp }}/${{ matrix.layer }}.tfplan
          PLAN_LOG: ${{ runner.temp }}/${{ matrix.layer }}-plan.log
          PLAN_TEXT: ${{ runner.temp }}/${{ matrix.layer }}-plan.txt
        run: |
          set -euo pipefail
          set +e
          tofu -chdir=".tofu/envs/${{ matrix.layer }}" plan \
            -input=false \
            -lock=false \
            -no-color \
            -refresh=false \
            -detailed-exitcode \
            -out="${PLAN_FILE}" \
            >"${PLAN_LOG}" 2>&1
          plan_exit=$?
          set -e

          case "${plan_exit}" in
            0|2)
              tofu -chdir=".tofu/envs/${{ matrix.layer }}" show \
                -no-color "${PLAN_FILE}" >"${PLAN_TEXT}"
              ;;
            *)
              cp "${PLAN_LOG}" "${PLAN_TEXT}"
              ;;
          esac

          printf 'exitcode=%s\n' "${plan_exit}" >>"${GITHUB_OUTPUT}"

      - name: Publish bounded plan comment
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          LAYER: ${{ matrix.layer }}
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
          PLAN_TEXT: ${{ runner.temp }}/${{ matrix.layer }}-plan.txt
        with:
          script: |
            const fs = require("fs");
            const marker = `<!-- intelibill-tofu-plan-${process.env.LAYER} -->`;
            const exitCode = process.env.PLAN_EXITCODE || "not-run";
            const state =
              exitCode === "0" ? "No changes" :
              exitCode === "2" ? "Changes proposed" :
              "Plan failed";
            let rendered = "Plan output was unavailable because an earlier step failed.";
            if (fs.existsSync(process.env.PLAN_TEXT)) {
              rendered = fs.readFileSync(process.env.PLAN_TEXT, "utf8");
            }
            const maximumPlanLength = 58000;
            if (rendered.length > maximumPlanLength) {
              rendered =
                rendered.slice(0, maximumPlanLength) +
                "\n\n… output truncated; inspect the workflow log for the full plan.";
            }
            const body = [
              marker,
              `### OpenTofu plan: \`${process.env.LAYER}\``,
              `**${state}** (exit code \`${exitCode}\`)`,
              "<details><summary>Plan output</summary>",
              "",
              "```text",
              rendered,
              "```",
              "</details>",
            ].join("\n");
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce successful plan
        if: always()
        env:
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          set -euo pipefail
          case "${PLAN_EXITCODE:-}" in
            0|2)
              ;;
            *)
              printf 'OpenTofu plan did not complete successfully.\n' >&2
              exit 1
              ;;
          esac
