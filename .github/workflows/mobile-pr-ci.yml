name: Mobile PR CI
run-name: "${{ github.workflow }} · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mobile-pr-ci.yml
      - .github/workflows/mobile-main-ci.yml
      - src/mobile/android/intelibill_mobile/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-mobile:
    name: Build and Test Mobile
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/mobile/android/intelibill_mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Flutter version
        id: flutter-version
        run: |
          version="$(tr -d '[:space:]' < .flutter-version)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Verify pinned Flutter version
        run: |
          set -euo pipefail
          expected_version="$(tr -d '[:space:]' < .flutter-version)"
          actual_version="$(flutter --version | awk 'NR == 1 { print $2 }')"
          if [ "${actual_version}" != "${expected_version}" ]; then
            echo "Expected Flutter ${expected_version}, got ${actual_version}."
            exit 1
          fi

      - name: Restore Flutter packages
        run: flutter pub get

      - name: Build generated code
        run: ./tool/codegen.sh

      - name: Check for uncommitted generated changes
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- \
            'lib/**/*.g.dart' \
            'lib/**/*.freezed.dart' \
            'lib/src/core/localization/'; then
            echo "Generated code is not up to date."
            echo "From src/mobile/android/intelibill_mobile run: ./tool/codegen.sh"
            echo "Then commit the updated files under lib/."
            git diff --stat -- \
              'lib/**/*.g.dart' \
              'lib/**/*.freezed.dart' \
              'lib/src/core/localization/' || true
            exit 1
          fi

      - name: Check code formatting
        run: dart format --set-exit-if-changed .

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: src/mobile/android/intelibill_mobile/coverage/
          retention-days: 5

      - name: Build debug APK
        run: flutter build apk --debug
