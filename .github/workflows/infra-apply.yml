name: Infrastructure Apply

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/infra-apply.yml
      - .tofu/envs/**
      - .tofu/modules/**
      - .tofu/scripts/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-apply-main
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
  TF_VAR_admin_object_id: ${{ vars.TOFU_ADMIN_OBJECT_ID }}
  TF_VAR_admin_principal_name: ${{ vars.TOFU_ADMIN_PRINCIPAL_NAME }}
  TF_VAR_secret_officer_object_ids: ${{ vars.TOFU_SECRET_OFFICER_OBJECT_IDS }}

jobs:
  shared:
    name: Apply shared
    runs-on: ubuntu-latest
    environment: shared

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Azure login with infrastructure identity
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_INFRA }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate shared identifiers
        run: |
          set -euo pipefail
          required_variables=(
            TF_VAR_subscription_id
            TF_VAR_tenant_id
            TF_VAR_admin_object_id
            TF_VAR_admin_principal_name
          )
          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              printf 'Required GitHub variable is empty: %s\n' "${variable_name}" >&2
              exit 1
            fi
          done

      - name: Create and review shared saved plan
        env:
          PLAN_FILE: ${{ runner.temp }}/shared.tfplan
        run: |
          set -euo pipefail
          tofu -chdir=.tofu/envs/shared init -input=false -lockfile=readonly
          tofu -chdir=.tofu/envs/shared validate
          tofu -chdir=.tofu/envs/shared plan \
            -input=false \
            -out="${PLAN_FILE}"
          tofu -chdir=.tofu/envs/shared show -no-color "${PLAN_FILE}"

      - name: Guard shared firewall inventory
        env:
          PLAN_FILE: ${{ runner.temp }}/shared.tfplan
        run: .tofu/scripts/guard-shared-egress-plan.sh --plan-file "${PLAN_FILE}"

      - name: Apply exact shared plan
        env:
          PLAN_FILE: ${{ runner.temp }}/shared.tfplan
        run: tofu -chdir=.tofu/envs/shared apply "${PLAN_FILE}"

      - name: Verify shared firewall inventory
        run: .tofu/scripts/check-container-app-egress.sh

  dev:
    name: Apply dev
    needs: shared
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Azure login with infrastructure identity
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_INFRA }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate environment identifiers
        run: |
          set -euo pipefail
          required_variables=(
            TF_VAR_subscription_id
            TF_VAR_secret_officer_object_ids
          )
          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              printf 'Required GitHub variable is empty: %s\n' "${variable_name}" >&2
              exit 1
            fi
          done

      - name: Create and review dev saved plan
        env:
          PLAN_FILE: ${{ runner.temp }}/dev.tfplan
          PLAN_JSON: ${{ runner.temp }}/dev-plan.json
        run: |
          set -euo pipefail
          tofu -chdir=.tofu/envs/dev init -input=false -lockfile=readonly
          tofu -chdir=.tofu/envs/dev validate
          tofu -chdir=.tofu/envs/dev plan \
            -input=false \
            -out="${PLAN_FILE}"
          tofu -chdir=.tofu/envs/dev show -no-color "${PLAN_FILE}"
          tofu -chdir=.tofu/envs/dev show -json "${PLAN_FILE}" >"${PLAN_JSON}"
          jq -e '
            all(
              .resource_changes[]?;
              .type != "azurerm_container_app_environment" or
              (
                (.change.actions | contains(["create"]) | not) and
                (.change.actions | contains(["delete"]) | not)
              )
            )
          ' "${PLAN_JSON}" >/dev/null || {
            printf '%s\n' \
              'Container Apps environment creation/replacement requires the retained egress transition runbook.' >&2
            exit 1
          }

      - name: Apply exact dev plan
        env:
          PLAN_FILE: ${{ runner.temp }}/dev.tfplan
        run: tofu -chdir=.tofu/envs/dev apply "${PLAN_FILE}"

  prod:
    name: Apply prod
    needs: dev
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Azure login with infrastructure identity
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_INFRA }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate environment identifiers
        run: |
          set -euo pipefail
          required_variables=(
            TF_VAR_subscription_id
            TF_VAR_secret_officer_object_ids
          )
          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              printf 'Required GitHub variable is empty: %s\n' "${variable_name}" >&2
              exit 1
            fi
          done

      - name: Create and review prod saved plan
        env:
          PLAN_FILE: ${{ runner.temp }}/prod.tfplan
          PLAN_JSON: ${{ runner.temp }}/prod-plan.json
        run: |
          set -euo pipefail
          tofu -chdir=.tofu/envs/prod init -input=false -lockfile=readonly
          tofu -chdir=.tofu/envs/prod validate
          tofu -chdir=.tofu/envs/prod plan \
            -input=false \
            -out="${PLAN_FILE}"
          tofu -chdir=.tofu/envs/prod show -no-color "${PLAN_FILE}"
          tofu -chdir=.tofu/envs/prod show -json "${PLAN_FILE}" >"${PLAN_JSON}"
          jq -e '
            all(
              .resource_changes[]?;
              .type != "azurerm_container_app_environment" or
              (
                (.change.actions | contains(["create"]) | not) and
                (.change.actions | contains(["delete"]) | not)
              )
            )
          ' "${PLAN_JSON}" >/dev/null || {
            printf '%s\n' \
              'Container Apps environment creation/replacement requires the retained egress transition runbook.' >&2
            exit 1
          }

      - name: Apply exact prod plan
        env:
          PLAN_FILE: ${{ runner.temp }}/prod.tfplan
        run: tofu -chdir=.tofu/envs/prod apply "${PLAN_FILE}"
