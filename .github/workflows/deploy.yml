name: Application Release
run-name: "${{ github.workflow }} · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/**
      - .github/workflows/deploy.yml
      - src/backend/**
      - src/frontend/**
      - tests/backend/**
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
  push:
    branches:
      - main
    paths:
      - .github/scripts/**
      - .github/workflows/deploy.yml
      - src/backend/**
      - src/frontend/**
      - tests/backend/**
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
  workflow_dispatch:
    inputs:
      target:
        description: Publish images only, release dev, or promote through production
        required: true
        default: dev
        type: choice
        options:
          - publish
          - dev
          - prod

permissions:
  contents: read

concurrency:
  group: >-
    application-release-${{
      github.event_name == 'pull_request' &&
      format('pr-{0}', github.event.pull_request.number) ||
      'main'
    }}
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/chanakya-net/intelibill/api
  WEB_IMAGE: ghcr.io/chanakya-net/intelibill/web
  MIGRATE_IMAGE: ghcr.io/chanakya-net/intelibill/migrate
  RESOURCE_GROUP: intelibill-shared

jobs:
  validate:
    name: Build and test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test delivery helpers and workflow contracts
        run: |
          .github/scripts/tests/wait-for-container-app-job.test.sh
          .github/scripts/tests/wait-for-container-app-revisions.test.sh
          .github/scripts/tests/validate-phase-11-workflows.test.sh

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore backend
        run: dotnet restore src/backend/Intelibill.slnx

      - name: Build backend
        run: dotnet build src/backend/Intelibill.slnx --configuration Release --no-restore

      - name: Test backend
        run: |
          set -euo pipefail

          mapfile -t test_projects < <(find tests/backend -type f -name '*.csproj' | sort)
          if [ ${#test_projects[@]} -eq 0 ]; then
            echo 'No backend test projects found under tests/backend.'
            exit 1
          fi

          for project in "${test_projects[@]}"; do
            project_name=$(basename "${project}" .csproj)
            project_results_dir="TestResults/${project_name}"

            dotnet test "${project}" \
              --configuration Release \
              --no-build \
              --no-restore \
              --verbosity normal \
              --logger "trx;LogFileName=${project_name}.trx" \
              --results-directory "${project_results_dir}"
          done

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: src/frontend
        run: bun run build

      - name: Test frontend
        working-directory: src/frontend
        run: |
          set -euo pipefail
          mkdir -p ../../TestResults/frontend
          rm -rf coverage
          CI=true FORCE_COLOR=0 bun run test --watch=false --coverage 2>&1 | tee ../../TestResults/frontend/test-output.log
          sed -E 's/\x1B\[[0-9;]*[mK]//g' ../../TestResults/frontend/test-output.log > ../../TestResults/frontend/test-output.clean.log

      - name: Generate build and test badges
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail

          mkdir -p .github/badges

          mapfile -t test_projects < <(find tests/backend -type f -name '*.csproj' | sort)
          total_tests=0
          passed_tests=0

          for project in "${test_projects[@]}"; do
            project_name=$(basename "${project}" .csproj)
            trx_file="TestResults/${project_name}/${project_name}.trx"
            if [ ! -f "${trx_file}" ]; then
              echo "Expected TRX file not found for ${project_name}: ${trx_file}"
              exit 1
            fi

            total=$(grep -oP 'Counters[^>]*total="\K[0-9]+' "${trx_file}" | head -1 || true)
            passed=$(grep -oP 'Counters[^>]*passed="\K[0-9]+' "${trx_file}" | head -1 || true)
            total_tests=$((total_tests + ${total:-0}))
            passed_tests=$((passed_tests + ${passed:-0}))
          done

          backend_color="red"
          if [ "${total_tests}" -eq 0 ]; then
            backend_color="lightgrey"
          elif [ "${passed_tests}" -eq "${total_tests}" ]; then
            backend_color="brightgreen"
          elif [ "${passed_tests}" -gt 0 ]; then
            backend_color="yellow"
          fi

          backend_message="${passed_tests}/${total_tests} passed"
          cat > .github/badges/tests.json <<JSON
          {
            "schemaVersion": 1,
            "label": "tests",
            "message": "${backend_message}",
            "color": "${backend_color}"
          }
          JSON

          encoded_backend_message=$(printf '%s' "${backend_message}" | sed 's/%/%25/g; s/ /%20/g; s|/|%2F|g')
          curl -fsSL "https://img.shields.io/badge/tests-${encoded_backend_message}-${backend_color}.svg?style=flat" \
            -o .github/badges/tests.svg
          curl -fsSL "https://img.shields.io/badge/build-passing-brightgreen.svg?style=flat" \
            -o .github/badges/backend-build.svg

          frontend_log='TestResults/frontend/test-output.clean.log'
          tests_line=$(grep -E 'Tests[[:space:]]+[0-9]+[[:space:]]+passed([[:space:]]+\|[[:space:]]+[0-9]+[[:space:]]+skipped)?[[:space:]]+\([0-9]+\)' "${frontend_log}" | tail -1 || true)
          files_line=$(grep -E 'Test Files[[:space:]]+[0-9]+[[:space:]]+passed([[:space:]]+\|[[:space:]]+[0-9]+[[:space:]]+skipped)?[[:space:]]+\([0-9]+\)' "${frontend_log}" | tail -1 || true)
          frontend_passed=$(printf '%s\n' "${tests_line}" | sed -n 's/.*Tests[[:space:]]\+\([0-9][0-9]*\)[[:space:]]\+passed.*/\1/p')
          frontend_total=$(printf '%s\n' "${tests_line}" | sed -n 's/.*(\([0-9][0-9]*\)).*/\1/p')
          frontend_files=$(printf '%s\n' "${files_line}" | sed -n 's/.*(\([0-9][0-9]*\)).*/\1/p')
          frontend_passed=${frontend_passed:-0}
          frontend_total=${frontend_total:-0}
          frontend_files=${frontend_files:-0}

          if [ "${frontend_files}" -gt 0 ] && [ "${frontend_total}" -eq 0 ]; then
            echo "Failed to parse frontend test summary from ${frontend_log}."
            exit 1
          fi

          frontend_color="red"
          if [ "${frontend_total}" -eq 0 ]; then
            frontend_color="lightgrey"
          elif [ "${frontend_passed}" -eq "${frontend_total}" ]; then
            frontend_color="brightgreen"
          elif [ "${frontend_passed}" -gt 0 ]; then
            frontend_color="yellow"
          fi

          frontend_message="${frontend_passed}/${frontend_total} passed"
          cat > .github/badges/frontend-tests.json <<JSON
          {
            "schemaVersion": 1,
            "label": "frontend tests",
            "message": "${frontend_message}",
            "color": "${frontend_color}"
          }
          JSON

          encoded_frontend_message=$(printf '%s' "${frontend_message}" | sed 's/%/%25/g; s/ /%20/g; s|/|%2F|g')
          curl -fsSL "https://img.shields.io/badge/frontend%20tests-${encoded_frontend_message}-${frontend_color}.svg?style=flat" \
            -o .github/badges/frontend-tests.svg
          curl -fsSL "https://img.shields.io/badge/build-passing-brightgreen.svg?style=flat" \
            -o .github/badges/frontend-build.svg

      - name: Upload build and test badges
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-badges
          path: |
            .github/badges/tests.json
            .github/badges/tests.svg
            .github/badges/backend-build.svg
            .github/badges/frontend-tests.json
            .github/badges/frontend-tests.svg
            .github/badges/frontend-build.svg
          if-no-files-found: error

      - name: Build pull-request API image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          docker build \
            --file src/backend/Dockerfile \
            --tag "intelibill-api-pr:${GITHUB_SHA}" \
            .

      - name: Build pull-request web image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          docker build \
            --file src/frontend/Dockerfile \
            --tag "intelibill-web-pr:${GITHUB_SHA}" \
            .

      - name: Build pull-request migration image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          docker build \
            --file src/backend/Dockerfile.migrate \
            --tag "intelibill-migrate-pr:${GITHUB_SHA}" \
            .

      - name: Scan pull-request API image
        if: ${{ github.event_name == 'pull_request' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: intelibill-api-pr:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan pull-request web image
        if: ${{ github.event_name == 'pull_request' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: intelibill-web-pr:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan pull-request migration image
        if: ${{ github.event_name == 'pull_request' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: intelibill-migrate-pr:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  badges:
    name: Publish build and test badges
    needs: validate
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Download build and test badges
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: application-badges
          path: .github/badges

      - name: Commit badge updates
        run: |
          set -euo pipefail

          badge_files=(
            .github/badges/tests.json
            .github/badges/tests.svg
            .github/badges/backend-build.svg
            .github/badges/frontend-tests.json
            .github/badges/frontend-tests.svg
            .github/badges/frontend-build.svg
          )

          if [ -z "$(git status --porcelain -- "${badge_files[@]}")" ]; then
            echo 'No badge changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${badge_files[@]}"
          git commit -m 'ci: update application test badges'

          max_attempts=3
          for attempt in $(seq 1 ${max_attempts}); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Badge updates pushed successfully.'
              exit 0
            fi

            if [ "${attempt}" -lt "${max_attempts}" ]; then
              echo "Push attempt ${attempt} failed, retrying..."
              sleep 2
            fi
          done

          echo '::warning::Unable to push badge updates after retries. Skipping failure.'

  build_api:
    name: Build, publish, and scan API image
    needs: validate
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push API
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: mode=max
          sbom: true

      - name: Capture immutable API image reference
        id: reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ env.API_IMAGE }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Invalid API image digest from Buildx: %s\n' "${IMAGE_DIGEST}" >&2
            exit 1
          fi
          printf 'image=%s@%s\n' "${IMAGE_REPOSITORY}" "${IMAGE_DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: Scan API image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: >-
            ${{ steps.reference.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Record API image
        env:
          IMAGE_REF: ${{ steps.reference.outputs.image }}
        run: |
          {
            printf '## Immutable API release artifact\n\n'
            printf -- '- Commit: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Image: `%s`\n' "${IMAGE_REF}"
          } >>"${GITHUB_STEP_SUMMARY}"

  build_web:
    name: Build, publish, and scan web image
    needs: validate
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push web
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: mode=max
          sbom: true

      - name: Capture immutable web image reference
        id: reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ env.WEB_IMAGE }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Invalid web image digest from Buildx: %s\n' "${IMAGE_DIGEST}" >&2
            exit 1
          fi
          printf 'image=%s@%s\n' "${IMAGE_REPOSITORY}" "${IMAGE_DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: Scan web image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: >-
            ${{ steps.reference.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Record web image
        env:
          IMAGE_REF: ${{ steps.reference.outputs.image }}
        run: |
          {
            printf '## Immutable web release artifact\n\n'
            printf -- '- Commit: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Image: `%s`\n' "${IMAGE_REF}"
          } >>"${GITHUB_STEP_SUMMARY}"

  build_migrate:
    name: Build, publish, and scan migration image
    needs: validate
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push migration bundle
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/backend/Dockerfile.migrate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.MIGRATE_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
          provenance: mode=max
          sbom: true

      - name: Capture immutable migration image reference
        id: reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ env.MIGRATE_IMAGE }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Invalid migration image digest from Buildx: %s\n' "${IMAGE_DIGEST}" >&2
            exit 1
          fi
          printf 'image=%s@%s\n' "${IMAGE_REPOSITORY}" "${IMAGE_DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: Scan migration image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: >-
            ${{ steps.reference.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Record migration image
        env:
          IMAGE_REF: ${{ steps.reference.outputs.image }}
        run: |
          {
            printf '## Immutable migration release artifact\n\n'
            printf -- '- Commit: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Image: `%s`\n' "${IMAGE_REF}"
          } >>"${GITHUB_STEP_SUMMARY}"

  dev:
    name: Release dev
    needs:
      - build_api
      - build_web
      - build_migrate
    if: >-
      needs.build_api.result == 'success' &&
      needs.build_web.result == 'success' &&
      needs.build_migrate.result == 'success' &&
      vars.GHCR_PUBLIC == 'true' &&
      (
        github.event_name == 'push' ||
        inputs.target == 'dev' ||
        inputs.target == 'prod'
      )
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout deployment helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Azure login with dev deploy identity
        id: azure-login
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture previous dev images
        id: previous
        run: |
          set -euo pipefail
          previous_api="$(
            az containerapp show \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-dev-api \
              --query properties.template.containers[0].image \
              --output tsv
          )"
          previous_web="$(
            az containerapp show \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-dev-web \
              --query properties.template.containers[0].image \
              --output tsv
          )"
          [[ -n "${previous_api}" && -n "${previous_web}" ]]
          printf 'PREVIOUS_API_IMAGE=%s\n' "${previous_api}" >>"${GITHUB_ENV}"
          printf 'PREVIOUS_WEB_IMAGE=%s\n' "${previous_web}" >>"${GITHUB_ENV}"

      - name: Run dev migration
        env:
          MIGRATE_IMAGE_REF: ${{ needs.build_migrate.outputs.image }}
          # A cold pull of the migration image has taken 14 minutes, so the
          # default 10-minute budget reported a timeout before the container
          # had started and hid the real failure. Wait as long as the job's own
          # replica_timeout_in_seconds (1800) allows; the poller still exits as
          # soon as the execution reaches a terminal status.
          MAX_POLLS: 360
        run: |
          set -euo pipefail
          az containerapp job update \
            --resource-group "${RESOURCE_GROUP}" \
            --name intelibill-dev-migrate \
            --container-name migrate \
            --image "${MIGRATE_IMAGE_REF}" \
            --output none
          execution_name="$(
            az containerapp job start \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-dev-migrate \
              --query name \
              --output tsv
          )"
          [[ -n "${execution_name}" ]]
          .github/scripts/wait-for-container-app-job.sh \
            "${RESOURCE_GROUP}" \
            intelibill-dev-migrate \
            "${execution_name}"

      - name: Deploy dev application images
        env:
          API_IMAGE_REF: ${{ needs.build_api.outputs.image }}
          WEB_IMAGE_REF: ${{ needs.build_web.outputs.image }}
        run: |
          set -euo pipefail
          printf 'API_ROLLBACK_REQUIRED=true\n' >>"${GITHUB_ENV}"
          az containerapp update \
            --resource-group "${RESOURCE_GROUP}" \
            --name intelibill-dev-api \
            --image "${API_IMAGE_REF}" \
            --output none
          printf 'WEB_ROLLBACK_REQUIRED=true\n' >>"${GITHUB_ENV}"
          az containerapp update \
            --resource-group "${RESOURCE_GROUP}" \
            --name intelibill-dev-web \
            --image "${WEB_IMAGE_REF}" \
            --output none

      - name: Smoke dev release
        run: |
          .github/scripts/wait-for-container-app-revisions.sh \
            "${RESOURCE_GROUP}" \
            intelibill-dev-api \
            intelibill-dev-web

      - name: Record dev release
        env:
          API_IMAGE_REF: ${{ needs.build_api.outputs.image }}
          WEB_IMAGE_REF: ${{ needs.build_web.outputs.image }}
          MIGRATE_IMAGE_REF: ${{ needs.build_migrate.outputs.image }}
        run: |
          {
            printf '## Dev release\n\n'
            printf -- '- API: `%s` (previous `%s`)\n' "${API_IMAGE_REF}" "${PREVIOUS_API_IMAGE}"
            printf -- '- Web: `%s` (previous `%s`)\n' "${WEB_IMAGE_REF}" "${PREVIOUS_WEB_IMAGE}"
            printf -- '- Migration: `%s`\n' "${MIGRATE_IMAGE_REF}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Restore previous dev images after failure
        if: >-
          failure() &&
          steps.azure-login.outcome == 'success' &&
          steps.previous.outcome == 'success'
        run: |
          set -euo pipefail
          restored=false
          if [[ "${API_ROLLBACK_REQUIRED:-false}" == "true" ]]; then
            az containerapp update \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-dev-api \
              --image "${PREVIOUS_API_IMAGE}" \
              --output none
            restored=true
          fi
          if [[ "${WEB_ROLLBACK_REQUIRED:-false}" == "true" ]]; then
            az containerapp update \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-dev-web \
              --image "${PREVIOUS_WEB_IMAGE}" \
              --output none
            restored=true
          fi
          if [[ "${restored}" == "true" ]]; then
            .github/scripts/wait-for-container-app-revisions.sh \
              "${RESOURCE_GROUP}" \
              intelibill-dev-api \
              intelibill-dev-web
          fi

  prod:
    name: Release production
    needs:
      - build_api
      - build_web
      - build_migrate
      - dev
    if: >-
      needs.build_api.result == 'success' &&
      needs.build_web.result == 'success' &&
      needs.build_migrate.result == 'success' &&
      needs.dev.result == 'success' &&
      vars.GHCR_PUBLIC == 'true' &&
      (
        github.event_name == 'push' ||
        inputs.target == 'prod'
      )
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout deployment helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Azure login with production deploy identity
        id: azure-login
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture previous production images
        id: previous
        run: |
          set -euo pipefail
          previous_api="$(
            az containerapp show \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-prod-api \
              --query properties.template.containers[0].image \
              --output tsv
          )"
          previous_web="$(
            az containerapp show \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-prod-web \
              --query properties.template.containers[0].image \
              --output tsv
          )"
          [[ -n "${previous_api}" && -n "${previous_web}" ]]
          printf 'PREVIOUS_API_IMAGE=%s\n' "${previous_api}" >>"${GITHUB_ENV}"
          printf 'PREVIOUS_WEB_IMAGE=%s\n' "${previous_web}" >>"${GITHUB_ENV}"

      - name: Run production migration
        env:
          MIGRATE_IMAGE_REF: ${{ needs.build_migrate.outputs.image }}
          # Matches the dev budget: a cold image pull can outlast the default
          # 10 minutes, and the poller exits early on any terminal status.
          MAX_POLLS: 360
        run: |
          set -euo pipefail
          az containerapp job update \
            --resource-group "${RESOURCE_GROUP}" \
            --name intelibill-prod-migrate \
            --container-name migrate \
            --image "${MIGRATE_IMAGE_REF}" \
            --output none
          execution_name="$(
            az containerapp job start \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-prod-migrate \
              --query name \
              --output tsv
          )"
          [[ -n "${execution_name}" ]]
          .github/scripts/wait-for-container-app-job.sh \
            "${RESOURCE_GROUP}" \
            intelibill-prod-migrate \
            "${execution_name}"

      - name: Deploy production application images
        env:
          API_IMAGE_REF: ${{ needs.build_api.outputs.image }}
          WEB_IMAGE_REF: ${{ needs.build_web.outputs.image }}
        run: |
          set -euo pipefail
          printf 'API_ROLLBACK_REQUIRED=true\n' >>"${GITHUB_ENV}"
          az containerapp update \
            --resource-group "${RESOURCE_GROUP}" \
            --name intelibill-prod-api \
            --image "${API_IMAGE_REF}" \
            --output none
          printf 'WEB_ROLLBACK_REQUIRED=true\n' >>"${GITHUB_ENV}"
          az containerapp update \
            --resource-group "${RESOURCE_GROUP}" \
            --name intelibill-prod-web \
            --image "${WEB_IMAGE_REF}" \
            --output none

      - name: Smoke production release
        run: |
          .github/scripts/wait-for-container-app-revisions.sh \
            "${RESOURCE_GROUP}" \
            intelibill-prod-api \
            intelibill-prod-web

      - name: Record production release
        env:
          API_IMAGE_REF: ${{ needs.build_api.outputs.image }}
          WEB_IMAGE_REF: ${{ needs.build_web.outputs.image }}
          MIGRATE_IMAGE_REF: ${{ needs.build_migrate.outputs.image }}
        run: |
          {
            printf '## Production release\n\n'
            printf -- '- API: `%s` (previous `%s`)\n' "${API_IMAGE_REF}" "${PREVIOUS_API_IMAGE}"
            printf -- '- Web: `%s` (previous `%s`)\n' "${WEB_IMAGE_REF}" "${PREVIOUS_WEB_IMAGE}"
            printf -- '- Migration: `%s`\n' "${MIGRATE_IMAGE_REF}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Restore previous production images after failure
        if: >-
          failure() &&
          steps.azure-login.outcome == 'success' &&
          steps.previous.outcome == 'success'
        run: |
          set -euo pipefail
          restored=false
          if [[ "${API_ROLLBACK_REQUIRED:-false}" == "true" ]]; then
            az containerapp update \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-prod-api \
              --image "${PREVIOUS_API_IMAGE}" \
              --output none
            restored=true
          fi
          if [[ "${WEB_ROLLBACK_REQUIRED:-false}" == "true" ]]; then
            az containerapp update \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-prod-web \
              --image "${PREVIOUS_WEB_IMAGE}" \
              --output none
            restored=true
          fi
          if [[ "${restored}" == "true" ]]; then
            .github/scripts/wait-for-container-app-revisions.sh \
              "${RESOURCE_GROUP}" \
              intelibill-prod-api \
              intelibill-prod-web
          fi
