name: Application Release
run-name: "${{ github.workflow }} · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

"on":
  pull_request:
    branches:
      - main
    # Pull requests are watched for every project this workflow validates. Which
    # of them a run actually builds and tests is decided per change by the
    # `changes` job. Main pushes keep the original merchant release trigger set
    # below, so a licensing- or admin-only change never publishes or deploys
    # merchant images. Documentation alone never starts a run.
    paths:
      - .github/scripts/**
      - .github/workflows/deploy.yml
      - src/backend/intelibill/**
      - src/backend/shared/**
      - src/frontend/intelibill/**
      - src/frontend/shared/**
      - tests/backend/intelibill/**
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - src/backend/licensing/**
      - src/frontend/licensing/**
      - tests/backend/licensing/**
      - tests/backend/shared/**
      - tests/contracts/licensing/**
      - Intelibill.slnx
      - package.json
      - bun.lock
      - docker-compose.yml
      - scripts/db/**
      - scripts/dev/**
      - .dockerignore
      - "!**/*.md"
  push:
    branches:
      - main
    paths:
      - .github/scripts/**
      - .github/workflows/deploy.yml
      - src/backend/intelibill/**
      - src/backend/shared/**
      - src/frontend/intelibill/**
      - src/frontend/shared/**
      - tests/backend/intelibill/**
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      target:
        description: Publish images only, release dev, or promote through production
        required: true
        default: dev
        type: choice
        options:
          - publish
          - dev
          - prod

permissions:
  contents: read

concurrency:
  group: >-
    application-release-${{
      github.event_name == 'pull_request' &&
      format('pr-{0}', github.event.pull_request.number) ||
      'main'
    }}
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/chanakya-net/intelibill/api
  WEB_IMAGE: ghcr.io/chanakya-net/intelibill/web
  MIGRATE_IMAGE: ghcr.io/chanakya-net/intelibill/migrate
  RESOURCE_GROUP: intelibill-shared

jobs:
  # Every job below runs only for the projects a change can affect. The mapping
  # from changed paths to projects lives in .github/scripts/detect-changed-projects.sh.
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      backend_suites: ${{ steps.detect.outputs.backend_suites }}
      images: ${{ steps.detect.outputs.images }}
      merchant_web: ${{ steps.detect.outputs.merchant_web }}
      admin_web: ${{ steps.detect.outputs.admin_web }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pull request is checked out as its merge commit, whose first parent is
      # the base branch, so the diff is exactly what the pull request changes.
      # A push compares against the commit main pointed at before. Anything
      # else, or a range that cannot be resolved, validates everything.
      - name: Detect changed projects
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          detect=.github/scripts/detect-changed-projects.sh
          base=""
          case "${EVENT_NAME}" in
            pull_request) base="HEAD^1" ;;
            push) base="${BEFORE_SHA}" ;;
          esac

          if [ -n "${base}" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only "${base}" HEAD >changed-paths.txt
            echo "Changed paths:"
            cat changed-paths.txt
            "${detect}" <changed-paths.txt >detected.txt
          else
            echo "No comparable base commit; validating every project."
            "${detect}" --all >detected.txt
          fi

          cat detected.txt
          cat detected.txt >>"${GITHUB_OUTPUT}"
          {
            printf '## Projects validated\n\n```\n'
            cat detected.txt
            printf '```\n'
          } >>"${GITHUB_STEP_SUMMARY}"

  contracts:
    name: Test delivery helpers and workflow contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test delivery helpers and workflow contracts
        run: |
          .github/scripts/tests/detect-changed-projects.test.sh
          .github/scripts/tests/wait-for-container-app-job.test.sh
          .github/scripts/tests/wait-for-container-app-revisions.test.sh
          .github/scripts/tests/workflow-contracts.test.sh
          .github/scripts/tests/licensing-stack-contract.test.sh
          bash .github/scripts/tests/licensing-stack-harness.test.sh

  backend:
    name: Test ${{ matrix.suite.name }} backend
    needs: changes
    if: ${{ needs.changes.outputs.backend_suites != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.backend_suites) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # The root solution holds the merchant and licensing backends, the shared
      # projects and their consumer regression suites, so every suite compiles
      # against the same code the others do.
      - name: Restore backends
        run: dotnet restore Intelibill.slnx

      # The integration tests load pre-built Wolverine handler classes, as the
      # deployed image does, instead of compiling them in every API host they
      # start. Written before the build so the one solution build compiles them in.
      - name: Generate Wolverine handlers
        run: >-
          dotnet run --project src/backend/intelibill/Intelibill.Api --no-launch-profile
          --no-restore --configuration Release -- codegen write

      - name: Build backends
        run: dotnet build Intelibill.slnx --configuration Release --no-restore

      - name: Test backend
        env:
          INTEGRATION_TEST_PREGENERATED_HANDLERS: "1"
          SUITE_ROOTS: ${{ matrix.suite.roots }}
        run: |
          set -euo pipefail

          read -r -a suite_roots <<<"${SUITE_ROOTS}"
          mapfile -t test_projects < <(find "${suite_roots[@]}" -type f -name '*.csproj' | sort)
          if [ ${#test_projects[@]} -eq 0 ]; then
            echo "No backend test projects found under ${SUITE_ROOTS}."
            exit 1
          fi

          mkdir -p badge-data
          for project in "${test_projects[@]}"; do
            project_name=$(basename "${project}" .csproj)
            project_results_dir="TestResults/${project_name}"

            dotnet test "${project}" \
              --configuration Release \
              --no-build \
              --no-restore \
              --verbosity normal \
              --logger "trx;LogFileName=${project_name}.trx" \
              --results-directory "${project_results_dir}"

            trx_file="${project_results_dir}/${project_name}.trx"
            if [ ! -f "${trx_file}" ]; then
              echo "Expected TRX file not found for ${project_name}: ${trx_file}"
              exit 1
            fi
            total=$(grep -oP 'Counters[^>]*total="\K[0-9]+' "${trx_file}" | head -1 || true)
            passed=$(grep -oP 'Counters[^>]*passed="\K[0-9]+' "${trx_file}" | head -1 || true)
            printf '%s\t%s\t%s\n' "${project_name}" "${total:-0}" "${passed:-0}" \
              >>"badge-data/backend-${{ matrix.suite.name }}.tsv"
          done

      - name: Upload backend test counts
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: badge-backend-${{ matrix.suite.name }}
          path: badge-data/
          if-no-files-found: error

  merchant_web:
    name: Build and test merchant web
    needs: changes
    if: ${{ needs.changes.outputs.merchant_web == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      # One frozen install of the root Bun workspace serves the app and the
      # shared packages.
      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: src/frontend/intelibill
        run: bun run build

      - name: Test frontend
        working-directory: src/frontend/intelibill
        run: |
          set -euo pipefail
          mkdir -p ../../../TestResults/frontend
          rm -rf coverage
          CI=true FORCE_COLOR=0 bun run test --watch=false --coverage 2>&1 | tee ../../../TestResults/frontend/test-output.log
          sed -E 's/\x1B\[[0-9;]*[mK]//g' ../../../TestResults/frontend/test-output.log > ../../../TestResults/frontend/test-output.clean.log

      - name: Count frontend tests
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail

          frontend_log='TestResults/frontend/test-output.clean.log'
          tests_line=$(grep -E 'Tests[[:space:]]+[0-9]+[[:space:]]+passed([[:space:]]+\|[[:space:]]+[0-9]+[[:space:]]+skipped)?[[:space:]]+\([0-9]+\)' "${frontend_log}" | tail -1 || true)
          files_line=$(grep -E 'Test Files[[:space:]]+[0-9]+[[:space:]]+passed([[:space:]]+\|[[:space:]]+[0-9]+[[:space:]]+skipped)?[[:space:]]+\([0-9]+\)' "${frontend_log}" | tail -1 || true)
          frontend_passed=$(printf '%s\n' "${tests_line}" | sed -n 's/.*Tests[[:space:]]\+\([0-9][0-9]*\)[[:space:]]\+passed.*/\1/p')
          frontend_total=$(printf '%s\n' "${tests_line}" | sed -n 's/.*(\([0-9][0-9]*\)).*/\1/p')
          frontend_files=$(printf '%s\n' "${files_line}" | sed -n 's/.*(\([0-9][0-9]*\)).*/\1/p')
          frontend_passed=${frontend_passed:-0}
          frontend_total=${frontend_total:-0}
          frontend_files=${frontend_files:-0}

          if [ "${frontend_files}" -gt 0 ] && [ "${frontend_total}" -eq 0 ]; then
            echo "Failed to parse frontend test summary from ${frontend_log}."
            exit 1
          fi

          mkdir -p badge-data
          printf '%s\t%s\n' "${frontend_passed}" "${frontend_total}" >badge-data/frontend.tsv

      - name: Upload frontend test counts
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: badge-frontend
          path: badge-data/
          if-no-files-found: error

  admin_web:
    name: Build and test admin web
    needs: changes
    if: ${{ needs.changes.outputs.admin_web == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test admin web runtime server
        run: node --test src/frontend/licensing/tests/server.test.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build admin web
        working-directory: src/frontend/licensing
        run: bun run build

      - name: Test admin web
        working-directory: src/frontend/licensing
        run: CI=true FORCE_COLOR=0 bun run test --watch=false

  # Pull requests build and scan the images of the projects they change. Nothing
  # is pushed here; licensing and admin images are built for validation only.
  images:
    name: Build and scan ${{ matrix.image.name }} image
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build pull-request image
        env:
          DOCKERFILE: ${{ matrix.image.dockerfile }}
          IMAGE_TAG: ${{ matrix.image.tag }}
        run: |
          docker build \
            --file "${DOCKERFILE}" \
            --tag "${IMAGE_TAG}:${GITHUB_SHA}" \
            .

      - name: Scan pull-request image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ matrix.image.tag }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # The single gate every release job depends on. A project job that did not
  # run because its project is unchanged counts as passing.
  validate:
    name: Build and test application
    needs:
      - changes
      - contracts
      - backend
      - merchant_web
      - admin_web
      - images
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Require every selected validation to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          PROJECT_RESULTS: >-
            ${{ needs.backend.result }}
            ${{ needs.merchant_web.result }}
            ${{ needs.admin_web.result }}
            ${{ needs.images.result }}
        run: |
          set -euo pipefail

          if [ "${CHANGES_RESULT}" != success ] || [ "${CONTRACTS_RESULT}" != success ]; then
            echo "Change detection (${CHANGES_RESULT}) and contract tests (${CONTRACTS_RESULT}) must both succeed."
            exit 1
          fi

          for result in ${PROJECT_RESULTS}; do
            case "${result}" in
              success | skipped) ;;
              *)
                echo "A project validation job finished as ${result}."
                exit 1
                ;;
            esac
          done

  badges:
    name: Publish build and test badges
    needs: validate
    if: ${{ !cancelled() && needs.validate.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Download test counts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: badge-*
          path: badge-data
          merge-multiple: true

      # A run tests only the projects that changed, so the backend badge is
      # rebuilt from the last known counts of every test project, kept in
      # backend-projects.json, with this run's counts laid over them.
      - name: Generate build and test badges
        run: |
          set -euo pipefail

          mkdir -p .github/badges badge-data
          projects_file=.github/badges/backend-projects.json
          [ -f "${projects_file}" ] || echo '{}' >"${projects_file}"

          shopt -s nullglob
          backend_counts=(badge-data/backend-*.tsv)
          if [ ${#backend_counts[@]} -gt 0 ]; then
            cat "${backend_counts[@]}" | jq -R -s --slurpfile known "${projects_file}" '
              reduce (split("\n")[] | select(length > 0) | split("\t")) as $row
                ($known[0]; .[$row[0]] = {total: ($row[1] | tonumber), passed: ($row[2] | tonumber)})
            ' >"${projects_file}.new"
            mv "${projects_file}.new" "${projects_file}"

            total_tests=$(jq '[.[].total] | add // 0' "${projects_file}")
            passed_tests=$(jq '[.[].passed] | add // 0' "${projects_file}")

            backend_color="red"
            if [ "${total_tests}" -eq 0 ]; then
              backend_color="lightgrey"
            elif [ "${passed_tests}" -eq "${total_tests}" ]; then
              backend_color="brightgreen"
            elif [ "${passed_tests}" -gt 0 ]; then
              backend_color="yellow"
            fi

            backend_message="${passed_tests}/${total_tests} passed"
            cat > .github/badges/tests.json <<JSON
          {
            "schemaVersion": 1,
            "label": "tests",
            "message": "${backend_message}",
            "color": "${backend_color}"
          }
          JSON

            encoded_backend_message=$(printf '%s' "${backend_message}" | sed 's/%/%25/g; s/ /%20/g; s|/|%2F|g')
            curl -fsSL "https://img.shields.io/badge/tests-${encoded_backend_message}-${backend_color}.svg?style=flat" \
              -o .github/badges/tests.svg
            curl -fsSL "https://img.shields.io/badge/build-passing-brightgreen.svg?style=flat" \
              -o .github/badges/backend-build.svg
          fi

          if [ -f badge-data/frontend.tsv ]; then
            IFS=$'\t' read -r frontend_passed frontend_total <badge-data/frontend.tsv

            frontend_color="red"
            if [ "${frontend_total}" -eq 0 ]; then
              frontend_color="lightgrey"
            elif [ "${frontend_passed}" -eq "${frontend_total}" ]; then
              frontend_color="brightgreen"
            elif [ "${frontend_passed}" -gt 0 ]; then
              frontend_color="yellow"
            fi

            frontend_message="${frontend_passed}/${frontend_total} passed"
            cat > .github/badges/frontend-tests.json <<JSON
          {
            "schemaVersion": 1,
            "label": "frontend tests",
            "message": "${frontend_message}",
            "color": "${frontend_color}"
          }
          JSON

            encoded_frontend_message=$(printf '%s' "${frontend_message}" | sed 's/%/%25/g; s/ /%20/g; s|/|%2F|g')
            curl -fsSL "https://img.shields.io/badge/frontend%20tests-${encoded_frontend_message}-${frontend_color}.svg?style=flat" \
              -o .github/badges/frontend-tests.svg
            curl -fsSL "https://img.shields.io/badge/build-passing-brightgreen.svg?style=flat" \
              -o .github/badges/frontend-build.svg
          fi

      - name: Commit badge updates
        run: |
          set -euo pipefail

          badge_files=(
            .github/badges/backend-projects.json
            .github/badges/tests.json
            .github/badges/tests.svg
            .github/badges/backend-build.svg
            .github/badges/frontend-tests.json
            .github/badges/frontend-tests.svg
            .github/badges/frontend-build.svg
          )

          if [ -z "$(git status --porcelain -- "${badge_files[@]}")" ]; then
            echo 'No badge changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${badge_files[@]}"
          git commit -m 'ci: update application test badges'

          max_attempts=3
          for attempt in $(seq 1 ${max_attempts}); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Badge updates pushed successfully.'
              exit 0
            fi

            if [ "${attempt}" -lt "${max_attempts}" ]; then
              echo "Push attempt ${attempt} failed, retrying..."
              sleep 2
            fi
          done

          echo '::warning::Unable to push badge updates after retries. Skipping failure.'

  build_api:
    name: Build, publish, and scan API image
    needs: validate
    if: ${{ !cancelled() && needs.validate.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push API
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/backend/intelibill/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: mode=max
          sbom: true

      - name: Capture immutable API image reference
        id: reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ env.API_IMAGE }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Invalid API image digest from Buildx: %s\n' "${IMAGE_DIGEST}" >&2
            exit 1
          fi
          printf 'image=%s@%s\n' "${IMAGE_REPOSITORY}" "${IMAGE_DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: Scan API image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: >-
            ${{ steps.reference.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Record API image
        env:
          IMAGE_REF: ${{ steps.reference.outputs.image }}
        run: |
          {
            printf '## Immutable API release artifact\n\n'
            printf -- '- Commit: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Image: `%s`\n' "${IMAGE_REF}"
          } >>"${GITHUB_STEP_SUMMARY}"

  build_web:
    name: Build, publish, and scan web image
    needs: validate
    if: ${{ !cancelled() && needs.validate.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push web
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/frontend/intelibill/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: mode=max
          sbom: true

      - name: Capture immutable web image reference
        id: reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ env.WEB_IMAGE }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Invalid web image digest from Buildx: %s\n' "${IMAGE_DIGEST}" >&2
            exit 1
          fi
          printf 'image=%s@%s\n' "${IMAGE_REPOSITORY}" "${IMAGE_DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: Scan web image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: >-
            ${{ steps.reference.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Record web image
        env:
          IMAGE_REF: ${{ steps.reference.outputs.image }}
        run: |
          {
            printf '## Immutable web release artifact\n\n'
            printf -- '- Commit: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Image: `%s`\n' "${IMAGE_REF}"
          } >>"${GITHUB_STEP_SUMMARY}"

  build_migrate:
    name: Build, publish, and scan migration image
    needs: validate
    if: ${{ !cancelled() && needs.validate.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push migration bundle
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/backend/intelibill/Dockerfile.migrate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.MIGRATE_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
          provenance: mode=max
          sbom: true

      - name: Capture immutable migration image reference
        id: reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ env.MIGRATE_IMAGE }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Invalid migration image digest from Buildx: %s\n' "${IMAGE_DIGEST}" >&2
            exit 1
          fi
          printf 'image=%s@%s\n' "${IMAGE_REPOSITORY}" "${IMAGE_DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: Scan migration image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: >-
            ${{ steps.reference.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Record migration image
        env:
          IMAGE_REF: ${{ steps.reference.outputs.image }}
        run: |
          {
            printf '## Immutable migration release artifact\n\n'
            printf -- '- Commit: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Image: `%s`\n' "${IMAGE_REF}"
          } >>"${GITHUB_STEP_SUMMARY}"

  # Deployment and its post-deploy checks are switched off until releases resume.
  # Set the repository variable RELEASE_DEPLOYMENTS_ENABLED to 'true' to turn them back on.
  dev:
    name: Release dev
    needs:
      - build_api
      - build_web
      - build_migrate
    if: >-
      !cancelled() &&
      vars.RELEASE_DEPLOYMENTS_ENABLED == 'true' &&
      needs.build_api.result == 'success' &&
      needs.build_web.result == 'success' &&
      needs.build_migrate.result == 'success' &&
      vars.GHCR_PUBLIC == 'true' &&
      (
        github.event_name == 'push' ||
        inputs.target == 'dev' ||
        inputs.target == 'prod'
      )
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout deployment helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Azure login with dev deploy identity
        id: azure-login
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture previous dev images
        id: previous
        run: |
          set -euo pipefail
          previous_api="$(
            az containerapp show \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-dev-api \
              --query properties.template.containers[0].image \
              --output tsv
          )"
          previous_web="$(
            az containerapp show \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-dev-web \
              --query properties.template.containers[0].image \
              --output tsv
          )"
          [[ -n "${previous_api}" && -n "${previous_web}" ]]
          printf 'PREVIOUS_API_IMAGE=%s\n' "${previous_api}" >>"${GITHUB_ENV}"
          printf 'PREVIOUS_WEB_IMAGE=%s\n' "${previous_web}" >>"${GITHUB_ENV}"

      - name: Run dev migration
        env:
          MIGRATE_IMAGE_REF: ${{ needs.build_migrate.outputs.image }}
          # A cold pull of the migration image has taken 14 minutes, so the
          # default 10-minute budget reported a timeout before the container
          # had started and hid the real failure. Wait as long as the job's own
          # replica_timeout_in_seconds (1800) allows; the poller still exits as
          # soon as the execution reaches a terminal status.
          MAX_POLLS: 360
        run: |
          set -euo pipefail
          az containerapp job update \
            --resource-group "${RESOURCE_GROUP}" \
            --name intelibill-dev-migrate \
            --container-name migrate \
            --image "${MIGRATE_IMAGE_REF}" \
            --output none
          execution_name="$(
            az containerapp job start \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-dev-migrate \
              --query name \
              --output tsv
          )"
          [[ -n "${execution_name}" ]]
          .github/scripts/wait-for-container-app-job.sh \
            "${RESOURCE_GROUP}" \
            intelibill-dev-migrate \
            "${execution_name}"

      - name: Deploy dev application images
        env:
          API_IMAGE_REF: ${{ needs.build_api.outputs.image }}
          WEB_IMAGE_REF: ${{ needs.build_web.outputs.image }}
        run: |
          set -euo pipefail
          printf 'API_ROLLBACK_REQUIRED=true\n' >>"${GITHUB_ENV}"
          az containerapp update \
            --resource-group "${RESOURCE_GROUP}" \
            --name intelibill-dev-api \
            --image "${API_IMAGE_REF}" \
            --output none
          printf 'WEB_ROLLBACK_REQUIRED=true\n' >>"${GITHUB_ENV}"
          az containerapp update \
            --resource-group "${RESOURCE_GROUP}" \
            --name intelibill-dev-web \
            --image "${WEB_IMAGE_REF}" \
            --output none

      - name: Smoke dev release
        run: |
          .github/scripts/wait-for-container-app-revisions.sh \
            "${RESOURCE_GROUP}" \
            intelibill-dev-api \
            intelibill-dev-web

      - name: Record dev release
        env:
          API_IMAGE_REF: ${{ needs.build_api.outputs.image }}
          WEB_IMAGE_REF: ${{ needs.build_web.outputs.image }}
          MIGRATE_IMAGE_REF: ${{ needs.build_migrate.outputs.image }}
        run: |
          {
            printf '## Dev release\n\n'
            printf -- '- API: `%s` (previous `%s`)\n' "${API_IMAGE_REF}" "${PREVIOUS_API_IMAGE}"
            printf -- '- Web: `%s` (previous `%s`)\n' "${WEB_IMAGE_REF}" "${PREVIOUS_WEB_IMAGE}"
            printf -- '- Migration: `%s`\n' "${MIGRATE_IMAGE_REF}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Restore previous dev images after failure
        if: >-
          failure() &&
          steps.azure-login.outcome == 'success' &&
          steps.previous.outcome == 'success'
        run: |
          set -euo pipefail
          restored=false
          if [[ "${API_ROLLBACK_REQUIRED:-false}" == "true" ]]; then
            az containerapp update \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-dev-api \
              --image "${PREVIOUS_API_IMAGE}" \
              --output none
            restored=true
          fi
          if [[ "${WEB_ROLLBACK_REQUIRED:-false}" == "true" ]]; then
            az containerapp update \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-dev-web \
              --image "${PREVIOUS_WEB_IMAGE}" \
              --output none
            restored=true
          fi
          if [[ "${restored}" == "true" ]]; then
            .github/scripts/wait-for-container-app-revisions.sh \
              "${RESOURCE_GROUP}" \
              intelibill-dev-api \
              intelibill-dev-web
          fi

  prod:
    name: Release production
    needs:
      - build_api
      - build_web
      - build_migrate
      - dev
    if: >-
      !cancelled() &&
      vars.RELEASE_DEPLOYMENTS_ENABLED == 'true' &&
      needs.build_api.result == 'success' &&
      needs.build_web.result == 'success' &&
      needs.build_migrate.result == 'success' &&
      needs.dev.result == 'success' &&
      vars.GHCR_PUBLIC == 'true' &&
      (
        github.event_name == 'push' ||
        inputs.target == 'prod'
      )
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout deployment helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Azure login with production deploy identity
        id: azure-login
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture previous production images
        id: previous
        run: |
          set -euo pipefail
          previous_api="$(
            az containerapp show \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-prod-api \
              --query properties.template.containers[0].image \
              --output tsv
          )"
          previous_web="$(
            az containerapp show \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-prod-web \
              --query properties.template.containers[0].image \
              --output tsv
          )"
          [[ -n "${previous_api}" && -n "${previous_web}" ]]
          printf 'PREVIOUS_API_IMAGE=%s\n' "${previous_api}" >>"${GITHUB_ENV}"
          printf 'PREVIOUS_WEB_IMAGE=%s\n' "${previous_web}" >>"${GITHUB_ENV}"

      - name: Run production migration
        env:
          MIGRATE_IMAGE_REF: ${{ needs.build_migrate.outputs.image }}
          # Matches the dev budget: a cold image pull can outlast the default
          # 10 minutes, and the poller exits early on any terminal status.
          MAX_POLLS: 360
        run: |
          set -euo pipefail
          az containerapp job update \
            --resource-group "${RESOURCE_GROUP}" \
            --name intelibill-prod-migrate \
            --container-name migrate \
            --image "${MIGRATE_IMAGE_REF}" \
            --output none
          execution_name="$(
            az containerapp job start \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-prod-migrate \
              --query name \
              --output tsv
          )"
          [[ -n "${execution_name}" ]]
          .github/scripts/wait-for-container-app-job.sh \
            "${RESOURCE_GROUP}" \
            intelibill-prod-migrate \
            "${execution_name}"

      - name: Deploy production application images
        env:
          API_IMAGE_REF: ${{ needs.build_api.outputs.image }}
          WEB_IMAGE_REF: ${{ needs.build_web.outputs.image }}
        run: |
          set -euo pipefail
          printf 'API_ROLLBACK_REQUIRED=true\n' >>"${GITHUB_ENV}"
          az containerapp update \
            --resource-group "${RESOURCE_GROUP}" \
            --name intelibill-prod-api \
            --image "${API_IMAGE_REF}" \
            --output none
          printf 'WEB_ROLLBACK_REQUIRED=true\n' >>"${GITHUB_ENV}"
          az containerapp update \
            --resource-group "${RESOURCE_GROUP}" \
            --name intelibill-prod-web \
            --image "${WEB_IMAGE_REF}" \
            --output none

      - name: Smoke production release
        run: |
          .github/scripts/wait-for-container-app-revisions.sh \
            "${RESOURCE_GROUP}" \
            intelibill-prod-api \
            intelibill-prod-web

      - name: Record production release
        env:
          API_IMAGE_REF: ${{ needs.build_api.outputs.image }}
          WEB_IMAGE_REF: ${{ needs.build_web.outputs.image }}
          MIGRATE_IMAGE_REF: ${{ needs.build_migrate.outputs.image }}
        run: |
          {
            printf '## Production release\n\n'
            printf -- '- API: `%s` (previous `%s`)\n' "${API_IMAGE_REF}" "${PREVIOUS_API_IMAGE}"
            printf -- '- Web: `%s` (previous `%s`)\n' "${WEB_IMAGE_REF}" "${PREVIOUS_WEB_IMAGE}"
            printf -- '- Migration: `%s`\n' "${MIGRATE_IMAGE_REF}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Restore previous production images after failure
        if: >-
          failure() &&
          steps.azure-login.outcome == 'success' &&
          steps.previous.outcome == 'success'
        run: |
          set -euo pipefail
          restored=false
          if [[ "${API_ROLLBACK_REQUIRED:-false}" == "true" ]]; then
            az containerapp update \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-prod-api \
              --image "${PREVIOUS_API_IMAGE}" \
              --output none
            restored=true
          fi
          if [[ "${WEB_ROLLBACK_REQUIRED:-false}" == "true" ]]; then
            az containerapp update \
              --resource-group "${RESOURCE_GROUP}" \
              --name intelibill-prod-web \
              --image "${PREVIOUS_WEB_IMAGE}" \
              --output none
            restored=true
          fi
          if [[ "${restored}" == "true" ]]; then
            .github/scripts/wait-for-container-app-revisions.sh \
              "${RESOURCE_GROUP}" \
              intelibill-prod-api \
              intelibill-prod-web
          fi
