name: HSN Finder AI CI
run-name: "${{ github.workflow }} · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/hsn-finder-ai-ci.yml
      - src/services/hsn-finder-ai/**
      - tests/services/hsn-finder-ai/**
      - src/services/Directory.Build.props
      - src/services/Directory.Packages.props
      - tests/services/Directory.Build.props
      - tests/services/Directory.Packages.props
      - global.json
  push:
    branches:
      - main
    paths:
      - .github/workflows/hsn-finder-ai-ci.yml
      - src/services/hsn-finder-ai/**
      - tests/services/hsn-finder-ai/**
      - src/services/Directory.Build.props
      - src/services/Directory.Packages.props
      - tests/services/Directory.Build.props
      - tests/services/Directory.Packages.props
      - global.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hsn-finder-ai-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION: src/services/hsn-finder-ai/Sankra.HsnFinder.sln

jobs:
  build-and-test:
    name: Build and test hsn-finder-ai
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "${SOLUTION}"

      - name: Build
        run: dotnet build "${SOLUTION}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${SOLUTION}" --configuration Release --no-build --no-restore
